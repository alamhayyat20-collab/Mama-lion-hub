<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resit — Mama Lion & Lion King</title>
<meta name="theme-color" content="#0d2a20">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f2f2f0 url(marmar.jpg) center top/900px auto;color:#17201c}
.wrap{max-width:460px;margin:0 auto;padding:18px}
.kad{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
.logo{width:120px;display:block;margin:0 auto 6px}
pre{white-space:pre-wrap;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:#f8fafc;border-radius:12px;padding:12px;margin:12px 0}
.btn{display:block;width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:999px;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px;text-decoration:none}
.emas{background:linear-gradient(#f6e3a1,#d7b25a);color:#0d2a20}.hijau{background:#0d2a20;color:#f6e3a1}
.muted{color:#5f6b66;font-size:13px}
</style>
</head>
<body>
<div class="wrap"><div id="bahasaBox" style="text-align:right;margin-bottom:8px;color:#0d2a20"></div><div class="kad" id="isi"><p class="muted">Memuatkan resit…</p></div>
<p class="muted" style="text-align:center">Mama Lion & Lion King Premium Car Wash · Kuantan</p></div>
<script type="module">
import { firebaseConfig } from '../firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import { pasangBahasa } from '../i18n-lib.js?v=2026.11.18-1';
import { KAMUS, POLA } from './kamus-en.js?v=2026.11.18-1';
try{ if(new URLSearchParams(location.search).get('en') === '1' && !localStorage.getItem('sm_bahasa')) localStorage.setItem('sm_bahasa', 'en'); }catch(_){}
pasangBahasa({kamus: KAMUS, pola: POLA, kunci: 'sm_bahasa', tempat: '#bahasaBox'});
const db = getFirestore(initializeApp(firebaseConfig));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isi = document.getElementById('isi'), id = new URLSearchParams(location.search).get('id') || '';
try{
  if(!/^[A-Za-z0-9]{6,40}$/.test(id)) throw new Error('x');
  const s = await getDoc(doc(db, 'resit_awam', id));
  if(!s.exists()) throw new Error('x');
  const r = s.data(), logo = r.cawangan === 'lion-king' ? 'logo-lionking.jpg' : 'logo-mamalion.jpg';
  const blob = await (await fetch(r.pdf)).blob(), url = URL.createObjectURL(new File([blob], r.namaFail || 'Resit.pdf', {type: 'application/pdf'}));
  isi.innerHTML = `<img class="logo" src="${logo}" alt=""><h2 style="margin:4px 0">${esc(r.kedai)}</h2>
    <div class="muted">Resit ${esc(r.no)} · ${esc(r.plat)}</div><div style="font-size:28px;font-weight:800;margin-top:6px">RM ${(+r.jumlah).toFixed(2)}</div>
    <pre data-tiada-terjemah>${esc(r.teks || '')}</pre>
    <a class="btn emas" href="${url}" target="_blank" rel="noopener">📄 Buka resit PDF</a>
    <a class="btn hijau" href="${url}" download="${esc(r.namaFail || 'Resit.pdf')}">⬇ Simpan PDF</a>
    <a class="btn" style="background:#e2e8f0;color:#0d2a20" href="./">⭐ Safari Members — kumpul cop Free Wash</a>`;
}catch(e){ isi.innerHTML = '<h2>Resit tidak dijumpai</h2><p class="muted">Pautan tidak sah atau telah dipadam. Sila hubungi kaunter.</p>'; }
</script>
</body>
</html>
