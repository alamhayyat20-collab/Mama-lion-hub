<script>
// Penyelamat: jika apps tersangkut "Memuatkan…" (fail lama dalam cache telefon), muat semula versi terbaru
setTimeout(function(){
  var a = document.getElementById('app');
  if(!a || !/^\s*Memuatkan…\s*$/.test(a.innerText || '')) return;
  a.innerHTML = '<div class="card" style="padding:16px"><b>Apps tidak dapat dimuatkan.</b><p style="color:#64748b">Mungkin versi lama tersimpan dalam telefon. Tekan butang di bawah untuk memuat versi terkini.</p><button id="btnPulih" style="width:100%;padding:14px;border:0;border-radius:12px;background:#14532d;color:#fff;font-weight:700;font-size:16px">🔄 MUAT VERSI TERKINI</button></div>';
  document.getElementById('btnPulih').onclick = function(){
    var p = [];
    if(window.caches) p.push(caches.keys().then(function(k){ return Promise.all(k.map(function(x){ return caches.delete(x); })); }));
    if(navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(r){ return Promise.all(r.map(function(x){ return x.unregister(); })); }));
    Promise.all(p).catch(function(){}).then(function(){ location.replace(location.pathname + '?v=' + Date.now()); });
  };
}, 9000);
</script>

const val = id => String($(id)?.value || '').trim();

const simpanLS = (k, v) => { try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(_){} };
const bacaLS = k => { try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(_){ return null; } };

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const store = getFirestore(fbApp);
const K = (c, n) => collection(store, 'kakitangan', c, n);

let dev = null, stafSemua = {}, sesi = null, saya = null, tab = 'Kehadiran';
let unsubAsas = [], unsubSaya = [];
let rosterBulan = {}, hadirHariIni = [], tetapan = {}, roster = {}, mohonSaya = [], hadirBulan = [], bulanRekod = hariIni().slice(0,7), mohonJenis = 'advance';
const stopAll = l => { l.forEach(f => f && f()); l.length = 0; };
// Cawangan tempat bertugas hari ini: punch masuk terakhir → roster → pusat
const cawKini = () => { const m = [...hadirHariIni].filter(r => r.jenis === 'masuk' && r.cawangan).sort((a,b) => masaMs(b) - masaMs(a))[0];

// Gambar profil staf (ditetapkan oleh pengurusan): lionsafari/{cawangan}/staf_foto/{id}

let unsubMO = [], unsubChat = [];
let tugasSaya = [], mesejSaya = [], chatAwal = true, arahanSeg = 'Tugas', pgSeg = null, infoSemua = [], promoSemua = null, unsubPromo = null;

function sahkanPin(tajuk){
  return new Promise(res => {
    const w = document.createElement('div'); w.style.cssText = 'position:fixed;inset:0;background:#0008;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px';
    w.innerHTML = `<div class="card" style="width:100%;max-width:360px;margin:0"><h3 style="margin-top:0">${esc(tajuk)}</h3><label>Sebab diskaun</label><input id="dkSebab" placeholder="cth: pelanggan tetap / kotoran tidak hilang">
      <label>PIN anda (${esc(saya.nama)})</label><input id="dkPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••">
      <div class="grid2" style="margin-top:10px"><button class="btn" id="dkBatal">Batal</button><button class="btn pri" id="dkOk">✅ Sahkan</button></div></div>`;
    document.body.appendChild(w); setTimeout(() => $('#dkSebab').focus(), 50);
    const tutup = v => { w.remove(); res(v); };
    $('#dkBatal').onclick = () => tutup(null);
    $('#dkOk').onclick = async () => { const p = $('#dkPin').value.trim(); if(p.length < 4) return toast('Masukkan PIN');
      if(await hashPin(saya.id, p) !== saya.pinHash) return toast('PIN salah'); tutup({sebab: $('#dkSebab').value.trim()}); };
  });
}

function viewOrder(){

      <div class="card"><div class="muted">Hari ini</div><div class="metric">${RM(komHari)}</div><div class="muted">${tunggu ? `+ ${RM(tunggu)} tunggu bayaran` : `${hariSaya.length} order`}</div></div></div>
    ${k.masihMasuk ? `<button class="punch masuk" id="btnOrderBaru">➕ AMBIL ORDER BARU<small>No. plat · pelanggan · pakej · gambar kenderaan</small></button>`
      : `<div class="card notice">🕘 Anda perlu <b>PUNCH IN</b> dahulu sebelum boleh mengambil order.<br><button class="btn pri" id="btnKeHadir" style="margin-top:8px">Pergi ke Kehadiran</button></div>`}
    <div class="card" style="margin-top:12px"><h3>Order saya hari ini</h3>${hariSaya.map(o => `<div class="item"><div><b>${esc(o.plat)} ${o.ahli ? '⭐' : ''}${o.freeWash ? '🎁' : ''}</b><small>${fJam(o.masaDibuat)} · ${esc(o.no||'')} · ${esc(o.pakej)}${(o.addon||[]).length ? ' + ' + o.addon.map(a => esc(a.nama)).join(', ') : ''}</small></div>
      <div style="text-align:right"><span class="tag ${o.status==='Selesai'?'ok':o.status==='Batal'?'bad':'warn'}">${o.status === 'Selesai' ? 'Dibayar' : esc(o.status)}</span><br><small class="muted">${o.status === 'Batal' ? '—' : 'Komisen ' + RM(o.komisen)}</small></div></div>`).join('') || '<p class="muted">Belum ada order hari ini.</p>'}
      <p class="muted" style="margin-bottom:0">Komisen dikira bila pelanggan <b>sudah bayar</b> di kaunter, dan masuk ke gaji anda di Akaun.</p></div>`;
  pasangPilihCaw();

    $('#oJum').innerHTML = fw ? `${RM(j)} <small style="font-size:12px;font-weight:600">· 🎁 Free Wash</small>` : RM(j);
    $('#oKom').textContent = p ? `💰 Komisen anda: ${RM(hargaKom(p, addon, fw))}` : '';
  };
  const pilih = (box, key, multi) => $$(`${box} .choice`).forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(multi){ d.addon.has(i) ? d.addon.delete(i) : d.addon.add(i); b.classList.toggle('sel'); }
    else {
      if(key === 'pakej' && d.fw && L.pakej[i]?.id !== pakejFW()?.id) return toast(`Free Wash hanya untuk pakej ${pakejFW()?.nama}. Matikan Free Wash dahulu.`);
      d[key] = i; $$(`${box} .choice`).forEach(x => x.classList.toggle('sel', x === b));
    }
    kira();
  });
  pilih('#cKend','kenderaan'); pilih('#cPakej','pakej'); if(L.addon.length) pilih('#cAddon', null, true);

  // ---- Safari Members ----
  const ahliCol = () => collection(store, 'ahli');
  const lukisAhli = () => {
    const box = $('#oAhli'), a = d.ahli;
    if(!a && d.calon.length > 1){
      box.innerHTML = `<div class="notice">Beberapa ahli guna plat ini — pilih:<br>${d.calon.map((c,i) => `<button class="btn" data-calon="${i}" style="margin-top:6px;padding:8px 10px;font-size:13px">${esc(c.nama)} · ${esc(paparTelefon(c.telefon))}</button>`).join(' ')}</div>`;
      $$('[data-calon]').forEach(b => b.onclick = () => pilihAhli(d.calon[+b.dataset.calon]));
    } else if(!a) box.innerHTML = '';
    else {
      const k = keadaanKad(a), fwp = pakejFW();
      box.innerHTML = `<div class="ahlikad"><div class="between"><div><b>⭐ Safari Member · ${esc(a.kod)}</b><br><span class="muted">${esc(a.nama)} · ${esc(paparTelefon(a.telefon))}</span></div><button class="btn" id="oLepas" style="padding:6px 10px">✕</button></div>
        <div class="copbar">${Array.from({length:KAD.saiz}, (_,i) => `<i class="${i < k.bil ? 'on' : ''} ${KAD.ganjaranPada.includes(i+1) ? 'g' : ''}"></i>`).join('')}<span>${k.bil}/${KAD.saiz}</span></div>
        ${k.freeWash.length ? `<label class="chk"><input type="checkbox" id="oFW" ${d.fw ? 'checked' : ''}> 🎁 Guna Free Wash (${k.freeWash.length} ada) — pakej ${esc(fwp?.nama || '')}. Perlu kelulusan Supervisor di kaunter.</label>` : `<div class="muted">Lagi ${k.lagiUntukGanjaran} cop untuk Free Wash</div>`}</div>`;
      $('#oLepas').onclick = () => { d.ahli = null; d.fw = null; lukisAhli(); lukisDaftar(); kira(); };
      if($('#oFW')) $('#oFW').onchange = e => {
        if(e.target.checked){
          const i = L.pakej.findIndex(p => p.id === fwp?.id);
          if(i < 0){ e.target.checked = false; return toast('Pakej Free Wash belum ditetapkan di kaunter'); }
          d.fw = {fwId: [...k.freeWash].sort((x,y) => x.tamat - y.tamat)[0].id}; d.pakej = i;
          $$('#cPakej .choice').forEach((x,j) => x.classList.toggle('sel', j === i));
        } else d.fw = null;
        kira();
      };
    }
  };
  const lukisDaftar = () => {
    $('#oDaftarBox').innerHTML = d.ahli ? '' : `<label class="chk"><input type="checkbox" id="oDaftar" checked> ⭐ Daftar pelanggan sebagai Safari Members (kad cop digital percuma)</label>
      <label class="chk"><input type="checkbox" id="oPromo"> Pelanggan setuju terima promosi melalui WhatsApp</label>`;
  };
  const pilihAhli = a => { d.ahli = a; d.calon = []; d.fw = null; $('#oNama').value = a.nama || ''; $('#oTel').value = paparTelefon(a.telefon); lukisAhli(); lukisDaftar(); kira(); };
  const cariAhli = async (medan, nilai) => {
    try{ const r = await getDocs(query(ahliCol(), where(medan, medan === 'plat' ? 'array-contains' : '==', nilai))); return r.docs.map(x => ({id:x.id, ...x.data()})); }
    catch(e){ console.error(e); return []; }
  };
  let tunda;
  $('#oPlat').oninput = () => { clearTimeout(tunda); const p = normPlat(val('#oPlat')); if($('#oLama')) $('#oLama').innerHTML = ''; if(p.length < 3 || d.ahli) return;
    tunda = setTimeout(async () => { const l = await cariAhli('plat', p); if(normPlat(val('#oPlat')) !== p) return; d.calon = l; if(l.length === 1) pilihAhli(l[0]); else lukisAhli();
        const lm = l.length ? null : await cariRekodLama(store, {getDoc, doc}, p); if(normPlat(val('#oPlat')) !== p) return;
        $('#oLama').innerHTML = htmlRekodLama(lm); if(lm?.n && !val('#oNama')) $('#oNama').value = lm.n; }, 500); };
  $('#oTel').onchange = async () => { if(d.ahli) return; const t = normTelefon(val('#oTel')); if(!telefonSah(t)) return;
    const l = await cariAhli('telefon', t); if(l.length){ pilihAhli(l[0]); toast(`⭐ ${l[0].nama} sudah ahli (${l[0].kod})`); } };
  $('#oCari').onclick = async () => {
    const q = prompt('Cari Safari Member: no. telefon atau kod ahli (cth SMAB12CD)'); if(!q) return;
    const kod = q.trim().toUpperCase();
    const l = /^SM[A-Z0-9]{6}$/.test(kod) ? await cariAhli('kod', kod) : await cariAhli('telefon', normTelefon(q));
    if(!l.length) return toast('Ahli tidak dijumpai');
    pilihAhli(l[0]);
  };
  $('#oImbas').onclick = () => imbasKod(async kod => { const l = await cariAhli('kod', kod); if(!l.length) return toast(`Kod ${kod} tidak dijumpai`); pilihAhli(l[0]); });
  lukisDaftar(); kira();

  // ---- Gambar ----
  $$('[data-foto]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; inp.value = ''; if(!f) return;
    try{
      const g = await capGambar(f, null, 720, 0.6), jenis = inp.dataset.foto;
      if(jenis === 'calar'){
        if(d.foto.calar.length >= 4) return toast('Maksimum 4 gambar calar');
        d.foto.calar.push(g);
        $('#fCalarList').innerHTML = d.foto.calar.map((x,i) => `<img src="${x}" data-buang="${i}" title="Tekan untuk buang">`).join('');
        $$('[data-buang]').forEach(im => im.onclick = () => { d.foto.calar.splice(+im.dataset.buang, 1); im.remove(); });
      } else { d.foto[jenis] = g; const el = inp.closest('.foto'); el.classList.add('ada'); el.style.backgroundImage = `url(${g})`; }
    }catch(_){ toast('Gagal membaca gambar'); }
  });

  $('#oBatal').onclick = () => { if(confirm('Batalkan order ini?')){ $('#app').dataset.sibuk = ''; render(); } };

  // ---- Simpan ----
  $('#oSimpan').onclick = async () => {
    const plat = paparPlat(val('#oPlat')), nama = val('#oNama'), tel = normTelefon(val('#oTel'));
    if(!plat) return toast('Sila masukkan no. plat');
    if(!nama) return toast('Sila isi nama pelanggan');
    if(!telefonSah(tel)) return toast('No. telefon tidak sah (cth 012-3456789)');
    if(d.pakej === null) return toast('Sila pilih pakej');
    if(!d.foto.plat || !d.foto.emblem) return toast('Sila ambil gambar plat dan emblem kenderaan');
    if(!jamKerja(hadirHariIni).masihMasuk) return toast('Anda perlu punch in dahulu');
    const ada = orderHari.find(o => o.aktif && normPlat(o.plat) === normPlat(plat));
    if(ada) return toast(`${plat} sudah dalam queue (order ${ada.no}${ada.mo ? ' oleh ' + ada.mo.nama : ''})`);
    if(!navigator.onLine) return toast('⚠ Tiada internet. Order perlu online.');
    const p = L.pakej[d.pakej], k = L.kenderaan[d.kenderaan] || {nama:'', harga:0};
    const hp = hargaPakejK(p, k);
    if(hp == null) return toast(`${p.nama}: harga ikut permintaan bagi ${k.nama}. Rujuk kaunter.`);
    const addon = [...d.addon].map(i => ({id: L.addon[i].id, nama: L.addon[i].nama, harga: hargaAddonK(L.addon[i], k) ?? 0}));
    const tambah = r2(hp - p.harga);
    const fw = d.fw && d.ahli ? {fwId: d.fw.fwId, nilai: r2(hp)} : null;
    const kasar = r2((fw ? 0 : hp) + addon.reduce((t,a) => t + a.harga, 0));
    const t = hariOperasi(), no = `${t.slice(5,7)}${t.slice(8,10)}-${pad(orderHari.length + 1, 3)}`;
    $('#oSimpan').disabled = true; $('#oSimpan').textContent = 'Menyimpan…';
    try{
      let ahli = d.ahli;
      if(!ahli && $('#oDaftar')?.checked){
        const ad = await getDoc(doc(collection(store, 'ahli_telefon'), tel));
        if(ad.exists()){ const s2 = await getDoc(doc(ahliCol(), ad.data().token)); if(s2.exists()) ahli = {id:s2.id, ...s2.data()}; }
        if(!ahli){
          const token = buatToken(), baru = ahliBaru({nama, telefon: tel, plat:[normPlat(plat)], kenderaan:[{plat, jenis:k.nama}], cawanganUtama: cawO, setujuPromosi: !!$('#oPromo')?.checked, oleh: `${saya.nama} (MO ${cawO})`});
          const b = writeBatch(store);
          b.set(doc(ahliCol(), token), baru); b.set(doc(collection(store, 'ahli_telefon'), tel), {token});
          await b.commit();
          ahli = {id: token, ...baru};
        }
      }
      if(ahli && !(ahli.plat || []).includes(normPlat(plat))) updateDoc(doc(ahliCol(), ahli.id), {plat: arrayUnion(normPlat(plat)), kenderaan: arrayUnion({plat, jenis:k.nama})}).catch(console.error);
      if(ahli) setDoc(doc(store, 'ahli_masuk', kunciMasuk(ahli.telefon || tel, plat)), {token: ahli.id}).catch(console.error);
      const ref = doc(LS(cawO,'order'));
      const data = {no, plat, nama, telefon: tel, kenderaan: k.nama, tambahanKenderaan: fw ? 0 : tambah, pakejId: p.id, pakej: p.nama, hargaPakej: fw ? 0 : p.harga, addon,
        jumlahKasar: kasar, diskaun: 0, jumlah: kasar, bay: val('#oBay') || '', catatan: val('#oCat'), status: 'Menunggu', aktif: true,
        ahli: ahli ? {id: ahli.id, kod: ahli.kod, nama: ahli.nama} : null, freeWash: fw,
        mo: {id: saya.id, nama: saya.nama, idStaf: saya.idStaf || ''}, moId: saya.id, komisen: hargaKom(p, addon, fw),
        gambar: {plat: true, emblem: true, calar: d.foto.calar.length}, sumber: 'apps-pekerja',
        tarikh: t, bulan: t.slice(0,7), dibuatOleh: `${saya.nama} (MO)`, dibuat: serverTimestamp(), masaDibuat: Date.now()};
      await setDoc(ref, data);
      KT.cermin({...data, id: ref.id}, cawO);
      const foto = {plat: d.foto.plat, emblem: d.foto.emblem, calar: d.foto.calar, tarikh: t};
      setDoc(doc(LS(cawO,'order_gambar'), ref.id), foto).catch(onErr);
      selepasOrder({...data, id: ref.id}, foto);
    }catch(e){ console.error(e); onErr(e); $('#oSimpan').disabled = false; $('#oSimpan').textContent = 'SIMPAN ORDER'; }
  };
}

function selepasOrder(o, foto){
  const caw = CAWANGAN.find(c => c.id === cawO) || infoCaw();
  const teks = `🦁 *${caw.nama}* — Order ${o.no}\nPlat: *${o.plat}* (${o.kenderaan})\nPakej: ${o.pakej}${o.freeWash ? ' 🎁 FREE WASH' : ''}${(o.addon||[]).length ? '\nAdd-on: ' + o.addon.map(a => a.nama).join(', ') : ''}\nJumlah: ${RM(o.jumlah)}\nPelanggan: ${o.nama}${o.ahli ? ' ⭐ ' + o.ahli.kod : ''}${o.bay ? '\nBay: ' + o.bay : ''}\nMO: ${saya.idStaf} ${saya.nama}${o.catatan ? '\nCatatan: ' + o.catatan : ''}`;
  $('#app').innerHTML = `<div class="card center"><h3>✅ Order ${esc(o.no)} disimpan</h3><div class="syif">${esc(o.plat)}</div>
    <div class="thumbs" style="justify-content:center">${[foto.plat, foto.emblem, ...foto.calar].map(x => `<img src="${x}">`).join('')}</div>
    <p class="muted">Order sudah masuk ke Queue kaunter. Komisen ${RM(o.komisen)} dikira bila pelanggan bayar.</p>

// Imbas QR dengan kamera belakang. iPhone tiada BarcodeDetector → guna jsQR.
let jsQR = null;
async function imbasQR(tajuk, cocok){
  return new Promise(async selesai => {
    let strim, henti = false;
    const lapis = document.createElement('div');
    lapis.style.cssText = 'position:fixed;inset:0;background:#000e;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px';
    lapis.innerHTML = `<b style="color:#fff;text-align:center">${esc(tajuk)}</b><video playsinline muted style="width:100%;max-width:420px;border-radius:14px;background:#000"></video><canvas style="display:none"></canvas><button class="btn">Batal</button>`;
    document.body.appendChild(lapis);
    const tutup = hasil => { if(henti) return; henti = true; strim?.getTracks().forEach(t => t.stop()); lapis.remove(); selesai(hasil); };
    lapis.querySelector('button').onclick = () => tutup(null);
    try{
      strim = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const v = lapis.querySelector('video'); v.srcObject = strim; await v.play();
      let det = null;
      if('BarcodeDetector' in window){ try{ det = new BarcodeDetector({formats:['qr_code']}); }catch(_){} }
      if(!det && !jsQR){ try{ jsQR = (await import('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/+esm')).default; }catch(e){ toast('Pengimbas QR tidak dapat dimuat — semak internet'); return tutup(null); } }
      const cv = lapis.querySelector('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
      const loop = async () => {
        if(henti) return;
        try{
          let teks = '';
          if(det){ const r = await det.detect(v); teks = r[0]?.rawValue || ''; }
          else if(v.videoWidth){ cv.width = Math.min(640, v.videoWidth); cv.height = Math.round(v.videoHeight * cv.width / v.videoWidth); cx.drawImage(v, 0, 0, cv.width, cv.height); teks = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height)?.data || ''; }
          const hasil = teks && cocok(teks);
          if(hasil) return tutup(hasil);
        }catch(_){}
        setTimeout(() => requestAnimationFrame(loop), 120);
      };
      loop();
    }catch(e){ toast('Kamera tidak dapat dibuka: ' + e.message); tutup(null); }
  });
}
async function imbasKod(onKod){
  const k = await imbasQR('📷 Imbas QR kad Safari Members', t => (t.match(/SM[A-Z0-9]{6}/) || [])[0]);
  if(k) onKod(k);
  else if(k === undefined){ const m = prompt('Taip kod ahli (cth SMAB12CD):'); if(m) onKod(m.trim().toUpperCase()); }
}

let gpsJanji = null;
function dapatGPS(){
  return new Promise(res => {
    if(!navigator.geolocation) return res({ralat:'GPS tidak disokong'});
    navigator.geolocation.getCurrentPosition(p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}),
      e => res({ralat: e.code === 1 ? 'Kebenaran lokasi ditolak' : 'Lokasi tidak dapat dikesan'}), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });
}
function bukaSelfie(jenis, stesen){
  const inp = $('#kamera'); inp.value = '';
  inp.onchange = () => { const f = inp.files[0]; if(f) prosesPunch(jenis, f, stesen); };
  inp.click();                           // buka kamera depan
}
async function mulaPunch(jenis){
  if(!navigator.onLine) return toast('⚠ Tiada internet. Punch perlu online supaya masa server direkod.');
  gpsJanji = dapatGPS();                 // mula cari lokasi serentak
  if(punchBebas()) return bukaSelfie(jenis, null);
  // Punch card di stesen: imbas QR yang ditampal di stesen bertugas
  const q = await imbasQR(`📷 Imbas QR stesen untuk PUNCH ${jenis === 'masuk' ? 'IN' : 'OUT'}`, t => bacaQRStesen(t));
  if(!q) return;
  const stesen = (tetapan.stesen || []).find(x => x.id === q.id);
  if(!stesen || stesen.kunci !== q.kunci) return toast('⚠ QR stesen tidak sah atau sudah ditukar. Minta pengurus cetak QR terkini.');
  const tp = tempatHari(hariIni()), lain = tp?.c && (tp.s ? tp.s !== stesen.id : tp.c !== stesen.c);
  $('#app').dataset.sibuk = '1';
  $('#app').innerHTML = `<div class="card center"><h3>✅ Stesen dikenal pasti</h3><div class="syif">${esc(namaCaw(stesen.c))} · ${esc(stesen.nama)}</div>
    ${lain ? `<div class="notice" style="margin-top:8px">Jadual anda hari ini: <b>${esc(labelTempat(tetapan, tp))}</b>. Punch di stesen ini akan ditanda "bukan stesen jadual".</div>` : ''}
    <button class="punch ${jenis}" id="btnSelfie" style="margin-top:12px">📸 AMBIL SELFIE<small>untuk PUNCH ${jenis === 'masuk' ? 'IN' : 'OUT'}</small></button>
    <button class="btn big" id="btnBatalP" style="margin-top:8px">Batal</button></div>`;
  $('#btnSelfie').onclick = () => bukaSelfie(jenis, stesen);
  $('#btnBatalP').onclick = () => { $('#app').dataset.sibuk = ''; render(); };
}
async function prosesPunch(jenis, fail, stesen){
  // gambar mesti baru diambil (bukan dari galeri lama)
  if(fail.lastModified && Date.now() - fail.lastModified > 3*60*1000) return toast('⚠ Gambar mesti diambil sekarang dengan kamera, bukan dari galeri.');
  $('#app').dataset.sibuk = '1';
  $('#app').innerHTML = `<div class="card center"><h3>${jenis === 'masuk' ? 'PUNCH IN' : 'PUNCH OUT'}</h3><p class="muted" id="stat">📍 Mendapatkan lokasi…</p></div>`;
  try{
    const g = await gpsJanji;
    const gps = g && !g.ralat ? g : null;
    const kedai = tetapan.lokasi, jarak = gps && kedai ? jarakMeter(gps, kedai) : null;
    const luar = !stesen && !saya.punchBebas && jarak != null && jarak > (Number(tetapan.radius)||200);
    if(!gps && !confirm(`${g?.ralat || 'Lokasi tidak dapat dikesan'}.\nTeruskan tanpa GPS? Rekod akan ditanda "tiada GPS".`)) throw 'batal';
    if(luar && !confirm(`Anda berada kira-kira ${jarak}m dari kedai.\nTeruskan? Rekod akan ditanda "luar kawasan".`)) throw 'batal';
    $('#stat').textContent = '📷 Menyediakan gambar…';
    const sekarang = new Date(), cw = stesen?.c || cawKini(), caw = CAWANGAN.find(c => c.id === cw) || infoCaw();
    const tp = tempatHari(hariIni()), bukanJadual = !!(stesen && tp?.c && (tp.s ? tp.s !== stesen.id : tp.c !== stesen.c));
    const gambar = await capGambar(fail, [
      `${jenis === 'masuk' ? 'MASUK' : 'KELUAR'}  ${sekarang.toLocaleDateString('en-GB')} ${sekarang.toLocaleTimeString('en-GB')}`,
      `${saya.idStaf} ${saya.nama} · ${caw.nama}${stesen ? ' · ' + stesen.nama : ''}`,
      gps ? `GPS ${gps.lat}, ${gps.lng} ±${gps.acc}m${jarak != null ? ` · ${jarak}m dari kedai` : ''}` : 'GPS: tiada'
    ]);
    $('#stat').textContent = '☁ Menghantar…';
    const t = hariIni(), ref = doc(K(saya.c,'kehadiran'));
    const d = {stafId:saya.id, idStaf:saya.idStaf||'', nama:saya.nama, cawangan:cw, jenis, tarikh:t, bulan:t.slice(0,7),
      masa: serverTimestamp(), masaPeranti: sekarang.getTime(), gps, luarKawasan: luar, peranti: navigator.userAgent.slice(0,120),
      ...(stesen ? {stesenId: stesen.id, stesenNama: stesen.nama, bukanJadual} : {bebas: true})};
    if(jarak != null) d.jarak = jarak;
    await setDoc(ref, d);
    await setDoc(doc(K(saya.c,'kehadiran_gambar'), ref.id), {data:gambar, stafId:saya.id, tarikh:t, masa: serverTimestamp()});
    $('#app').innerHTML = `<div class="card center"><h3>✅ ${jenis === 'masuk' ? 'Punch in' : 'Punch out'} berjaya</h3><img class="prev" src="${gambar}"><button class="btn pri big" id="btnOk">OK</button></div>`;
    $('#btnOk').onclick = () => { $('#app').dataset.sibuk = ''; render(); };
  }catch(e){
    $('#app').dataset.sibuk = '';
    if(e !== 'batal'){ console.error(e); toast('⚠ Gagal: ' + (e.code === 'permission-denied' ? 'akses ditolak (rules)' : e.message || e)); }
    render();
  }
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pasangPrompt = e; });
function kadPasang(){
  if(standalone()) return '';
  return `<div class="card"><div class="between"><b>📲 Pasang Apps Pekerja</b><button class="btn emas" id="btnPasang" style="padding:9px 12px;font-size:13px">PASANG</button></div>
    <div class="muted" id="pasangInfo" style="margin-top:6px">${iOS ? 'iPhone: buka dalam Safari → Kongsi ⬆ → "Add to Home Screen".' : 'Android: tekan PASANG, atau menu ⋮ → "Install app".'} <a href="#" id="btnCaraPasang" onclick="return false">❓ Tidak boleh pasang?</a></div></div>`;
}
function pasangKadPasang(){
  if($('#btnPasang')) $('#btnPasang').onclick = async () => {
    if(pasangPrompt){ pasangPrompt.prompt(); await pasangPrompt.userChoice; pasangPrompt = null; }
    else panduanPasang({nama: 'Apps Pekerja'});
  };
  if($('#btnCaraPasang')) $('#btnCaraPasang').onclick = () => panduanPasang({nama: 'Apps Pekerja'});
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Butang 🔄 Sync: hantar data tertunggak, tarik data terkini & pastikan versi apps sama di semua telefon
pasangSync({store, tempat: '#syncBox', awalan: 'pekerja-ml-', sebelum: () => $('#app').dataset.sibuk === '1' ? 'Anda sedang punch in/out atau mengisi borang.' : ''});
</script>
</body>
</html>
