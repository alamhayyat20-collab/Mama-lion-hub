name: Publish Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semak secret
        id: semak
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "ada=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT belum ditambah. Rules tidak dipublish."
          else
            echo "ada=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.semak.outputs.ada == 'yes'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publish rules ke lion-safari
        if: steps.semak.outputs.ada == 'yes'
        run: npx -y firebase-tools@13 deploy --only firestore:rules --project lion-safari --non-interactive
