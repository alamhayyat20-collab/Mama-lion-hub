name: Publish Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semak secret
        id: semak
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "ada=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT belum ditambah. Rules tidak dipublish."
          else
            echo "ada=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.semak.outputs.ada == 'yes'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.semak.outputs.ada == 'yes'

      - name: Publish rules ke lion-safari
        if: steps.semak.outputs.ada == 'yes'
        run: |
          set -euo pipefail
          P=lion-safari
          TOKEN=$(gcloud auth print-access-token)
          API=https://firebaserules.googleapis.com/v1/projects/$P
          jq -n --rawfile c firestore.rules '{source:{files:[{name:"firestore.rules",content:$c}]}}' > body.json
          curl -sS --fail-with-body -X POST "$API/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d @body.json > ruleset.json || { cat ruleset.json; exit 1; }
          RS=$(jq -r .name ruleset.json)
          echo "Ruleset baru: $RS"
          jq -n --arg n "projects/$P/releases/cloud.firestore" --arg r "$RS" \
            '{release:{name:$n,rulesetName:$r}}' > rel.json
          curl -sS --fail-with-body -X PATCH "$API/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d @rel.json || exit 1
          echo
          echo "Rules berjaya dipublish ke Firestore $P"
