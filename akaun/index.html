<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Akaun Mama Lion</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Akaun ML">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial;background:#f3f4f6;color:#111827}
header{background:#14532d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header b{font-size:19px}
header small{display:block;color:#bbf7d0;margin-top:2px}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:9px;position:sticky;top:0;box-shadow:0 1px 4px #0002;z-index:5}
nav button{white-space:nowrap}
button{border:0;border-radius:9px;padding:10px 12px;cursor:pointer;background:#e5e7eb;font-size:14px}
button.active,.primary{background:#14532d;color:#fff}
.danger{background:#fee2e2;color:#991b1b}
.small{padding:6px 9px;font-size:12px}
.aksi{display:flex;flex-direction:column;gap:4px;align-items:flex-end;margin-top:5px}
main{max-width:1000px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0001;margin-bottom:12px}
.metric{font-size:22px;font-weight:750;margin-top:4px}
.muted{color:#6b7280;font-size:13px}
.pos{color:#15803d}.neg{color:#b91c1c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:4px 0 10px;font-size:16px;background:#fff}
label{font-size:13px;font-weight:650}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e5e7eb;font-size:13px;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.tot td{font-weight:750;border-top:2px solid #111827}
tr.sub td{background:#f9fafb;font-weight:650}
.tag{padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:11px;white-space:nowrap}
.tag.warn{background:#fef3c7}.tag.ok{background:#dcfce7}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;flex-wrap:wrap;gap:8px}
.section-title h3{margin:0}
.err{color:#b91c1c;font-size:13px;min-height:18px}
.notice{background:#fef3c7;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid #d1d5db}
.bars div{flex:1;background:#16a34a;border-radius:3px 3px 0 0;min-height:1px}
.bars div.z{background:#e5e7eb}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-top:3px}
.totalbox{background:#f0fdf4;border-radius:10px;padding:10px;font-weight:700;margin-bottom:10px}
.synctag{font-size:12px;padding:5px 9px;border-radius:999px;background:#166534;color:#dcfce7}
.scroll{overflow-x:auto}
footer{text-align:center;color:#6b7280;padding:22px;font-size:12px}
#pasangBox{max-width:1000px;margin:10px auto 0;padding:0 14px}
.overlay{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.overlay .box{border-radius:18px}}
.hidden{display:none!important}
.pk{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e7eb}
.pk.off{opacity:.55}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subnav button.on{background:#14532d;color:#fff}
#cawBar{max-width:1000px;margin:10px auto 0;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cawBar:empty{display:none}
.caw{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #e5e7eb;border-radius:14px;padding:8px 10px;text-align:left;box-shadow:0 2px 10px #0001}
.caw img{width:46px;height:46px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.caw b{display:block;font-size:15px}.caw span{font-size:12px;color:#6b7280}
.caw.sel{border-color:#14532d;background:#f0fdf4}
.caw.sel span{color:#15803d;font-weight:650}
#cawBar.besar .caw{flex-direction:column;text-align:center;padding:14px 8px}
#cawBar.besar .caw img{width:min(130px,100%);height:auto;aspect-ratio:1}
#pasangBox .card{margin:0;border:2px solid #f59e0b}
.btn-gold{background:#f59e0b;color:#111;font-weight:700}
header{padding-top:max(14px,env(safe-area-inset-top))}
@media(max-width:600px){.two{grid-template-columns:1fr}.metric{font-size:19px}}
@media print{header,nav,footer,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<header>
  <div><b>🦁 Akaun Mama Lion</b><small>Jualan • Pembelian • Belanja • Petty Cash • Laporan</small></div>
  <div class="row"><a href="../lionsafari/" style="color:#fff">Kembali ke Lion Safari V2</a><span id="userBox"></span></div>
</header>
<nav id="nav"></nav>
<div id="pasangBox" class="noprint"></div>
<div id="modal" class="overlay hidden"><div class="box" id="modalBox"></div></div>
<div id="cawBar" class="noprint"></div>
<div id="bulanBar" class="row" style="max-width:1000px;margin:10px auto 0;padding:0 14px"></div>
<main id="app"><div class="card muted">Memuatkan…</div></main>
<footer>Akaun Mama Lion • Data disimpan di Firebase (lion-safari) • Akses Management sahaja</footer>

<script type="module">
import { firebaseConfig, BRANCH_ID } from '../firebase-config.js';
import { modulPengurusan, CSS_MODUL, fMinit } from '../pekerja-lib.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { getFirestore, collection, query, where, getDocs, getDoc, getDocFromServer, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot, serverTimestamp, writeBatch } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

// ---------- Senarai kategori (boleh ubah di sini) ----------
const KAT_PEMBELIAN = ['Sabun & Kimia','Wax & Polish','Peralatan & Mesin','Tuala & Span','Barang Jualan (Minuman/Snek)','Alat Ganti','Lain-lain'];
const KAT_BELANJA   = ['Gaji & Upah','Komisen Staff','Sewa Premis','Elektrik','Air','Internet & Telefon','Penyelenggaraan','Pemasaran & Iklan','Pengangkutan & Minyak','Makan & Minum Staff','Lesen & Permit','Yuran Bank / Caj Online','Lain-lain'];
const KAT_PETTY     = ['Makan & Minum Staff','Pengangkutan & Minyak','Alat Tulis','Barang Kecil / Runcit','Penyelenggaraan Kecil','Lain-lain'];
const CARA_BAYAR    = ['Tunai','Bank / Transfer','Petty Cash','Kredit (Hutang)'];
const CARA_BAYAR_B  = ['Tunai','Bank / Transfer','Petty Cash'];
const KAEDAH_JUALAN = [['tunai','Tunai'],['qr','QR / DuitNow'],['kad','Kad Debit/Kredit'],['ewallet','e-Wallet (TNG/Grab)'],['lain','Lain-lain']];
const TABS = ['Jualan','Pembelian','Belanja','Petty Cash','Import'];
const OWNER_TABS = ['Ringkasan', ...TABS, 'Pekerja', 'Laporan'];

// ---------- Utiliti ----------
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = n => 'RM ' + (Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = id => { const v = parseFloat(($(id)?.value||'').replace(',','.')); return isNaN(v) ? 0 : Math.round(v*100)/100; };
const val = id => ($(id)?.value || '').trim();
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const sum = (arr, f) => arr.reduce((t,x) => t + (Number(f ? f(x) : x)||0), 0);
const BULAN_NAMA = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const fmtTarikh = t => { if(!t) return ''; const [y,m,d] = t.split('-'); return `${+d} ${BULAN_NAMA[+m-1]}`; };
const fmtBulan = b => { const [y,m] = b.split('-'); return `${BULAN_NAMA[+m-1]} ${y}`; };
const opts = (list, sel) => list.map(o => `<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');

// ---------- Keadaan ----------
let tab = 'Jualan';
let isOwner = false;
let monthLoaded = false;
let bulan = today().slice(0,7);
let entri = [];      // semua entri bulan dipilih
let pettyAll = [];   // semua entri yang guna petty cash (semua masa)
let hutangAll = [];  // semua pembelian kredit yang belum lunas
let editing = null;  // {id, data}
let user = null, nama = '', loginError = '', dataError = '';
let unsubBulan = null, unsubPetty = null, unsubHutang = null;
let unsubHR = [], unsubHRBulan = null;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const store = getFirestore(app);
// ---------- Cawangan (Mama Lion / Lion King) ----------
const CAWANGAN = [
  {id:'mama-lion', nama:'Mama Lion', logo:'logo-mamalion.jpg'},
  {id:'lion-king', nama:'Lion King', logo:'logo-lionking.jpg'}
];
let cawangan = (() => { try{ const c = localStorage.getItem('akaun_cawangan'); return CAWANGAN.some(x => x.id === c) ? c : BRANCH_ID; }catch(_){ return BRANCH_ID; } })();
const namaCawangan = () => CAWANGAN.find(x => x.id === cawangan)?.nama || cawangan;
const colFor = c => collection(store, 'akaun', c, 'entri');
let COL = colFor(cawangan);
const ownerRecord = uid => doc(store, 'akaun', BRANCH_ID, 'pemilik', uid);
const entryQuery = (...filters) => query(COL, ...filters,
  ...(isOwner ? [] : [where('assignedUid', '==', user.uid)]));

// ---------- Log masuk ----------
function renderLogin(){
  $('#nav').innerHTML = ''; $('#bulanBar').innerHTML = ''; $('#cawBar').innerHTML = '';
  $('#userBox').innerHTML = '';
  $('#app').innerHTML = `
  <div class="card" style="max-width:380px;margin:30px auto">
    <h3 style="margin-top:0">Log Masuk Management</h3>
    <p class="muted">Guna email & kata laluan yang sama seperti LionSafari.</p>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Kata laluan</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err">${esc(loginError)}</div>
    <button class="primary" style="width:100%;padding:14px" id="btnLogin">Log Masuk</button>
  </div>`;
  $('#btnLogin').onclick = doLogin;
  $('#pw').onkeydown = e => { if(e.key==='Enter') doLogin(); };
}
async function doLogin(){
  const em = val('#em'), pw = $('#pw').value;
  loginError = '';
  if(!em || !pw){ loginError = 'Sila isi email dan kata laluan.'; return renderLogin(); }
  $('#btnLogin').disabled = true; $('#btnLogin').textContent = 'Sedang log masuk…';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch(e){ loginError = e.code==='auth/invalid-credential' ? 'Email atau kata laluan salah.' : 'Ralat: '+e.message; renderLogin(); }
}

onAuthStateChanged(auth, async u => {
  stopListeners();
  user = null;
  isOwner = false;
  entri = []; pettyAll = []; hutangAll = []; editing = null;
  monthLoaded = false;
  dataError = '';
  if(!u) return renderLogin();
  try {
    const snap = await getDocs(query(collection(store,'staff'), where('email','==',u.email.toLowerCase())));
    const staff = snap.empty ? null : snap.docs[0].data();
    if(auth.currentUser !== u) return;
    if(!staff || staff.role !== 'Management'){
      loginError = 'Akses ditolak. Apps Akaun hanya untuk peranan Management.';
      await signOut(auth); return;
    }
    const owner = await getDocFromServer(ownerRecord(u.uid));
    if(!owner.exists()){
      const akses = await getDocFromServer(doc(store, 'akaun', BRANCH_ID, 'pengurusan', u.uid));
      if(!akses.exists()) throw new Error('Akses Akaun belum ditetapkan untuk pengguna ini.');
    }
    if(auth.currentUser !== u) return;
    isOwner = owner.exists();
    tab = isOwner ? 'Ringkasan' : 'Jualan';
    user = u; nama = staff.name || u.email;
    startListeners();
    renderShell();
  } catch(e){
    if(auth.currentUser !== u) return;
    loginError = 'Ralat menyemak peranan: ' + e.message;
    await signOut(auth);
  }
});

// ---------- Data (Firestore) ----------
function onErr(e){
  console.error(e);
  dataError = e.code === 'permission-denied'
    ? 'Firebase menolak akses (permission-denied). Peraturan Firestore untuk koleksi "akaun" perlu dikemas kini — lihat README.'
    : 'Ralat data: ' + e.message;
  refresh();
}
function startListeners(){
  subscribeBulan();
  if(isOwner) mulaHR();
  unsubPetty = onSnapshot(entryQuery(where('guna_petty','==',true)), s => { pettyAll = s.docs.map(d => ({id:d.id, ...d.data()})); refresh(); }, onErr);
  unsubHutang = onSnapshot(entryQuery(where('hutang','==',true)), s => { hutangAll = s.docs.map(d => ({id:d.id, ...d.data()})); refresh(); }, onErr);
}
function subscribeBulan(){
  if(unsubBulan) unsubBulan();
  entri = [];
  monthLoaded = false;
  dataError = '';
  unsubBulan = onSnapshot(entryQuery(where('bulan','==',bulan)), s => {
    entri = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.tarikh||'').localeCompare(a.tarikh||'') || ((b.dicipta?.seconds||0)-(a.dicipta?.seconds||0)));
    monthLoaded = true; refresh();
  }, onErr);
  if(isOwner) langganHRBulan();
}
function stopListeners(){ if(typeof modulPK !== 'undefined') modulPK.henti(); [unsubBulan,unsubPetty,unsubHutang,unsubHRBulan,...unsubHR].forEach(f => f && f()); unsubBulan=unsubPetty=unsubHutang=unsubHRBulan=null; unsubHR=[]; }

async function simpan(data){
  data.bulan = data.tarikh.slice(0,7);
  data.cawangan = cawangan;
  try {
    if(editing){
      await updateDoc(doc(COL, editing.id), {...data, dikemaskini_oleh:nama, dikemaskini:serverTimestamp()});
      toast('✅ Rekod dikemas kini');
    } else {
      await addDoc(COL, {...data, assignedUid:user.uid, oleh:nama, dicipta:serverTimestamp()});
      toast('✅ Rekod disimpan');
    }
    editing = null;
    renderTab();
  } catch(e){ onErr(e); toast('⚠ Gagal simpan: '+(e.code||e.message)); }
}
async function padam(id){
  if(!isOwner) return;
  if(!confirm('Padam rekod ini? Tindakan ini tidak boleh dibatalkan.')) return;
  try { await deleteDoc(doc(COL, id)); toast('🗑 Rekod dipadam'); if(editing?.id===id){ editing=null; renderTab(); } }
  catch(e){ onErr(e); }
}
function mulaEdit(id){
  const e = entri.find(x => x.id===id) || hutangAll.find(x => x.id===id) || pettyAll.find(x => x.id===id);
  if(!e) return;
  editing = {id, data:e};
  const peta = {jualan:'Jualan', pembelian:'Pembelian', belanja:'Belanja', petty:'Petty Cash'};
  tab = peta[e.jenis] || tab;
  renderShell();
  window.scrollTo({top:0, behavior:'smooth'});
}
async function tandaLunas(id){
  if(!confirm('Tandakan hutang ini sudah dibayar?')) return;
  try { await updateDoc(doc(COL,id), {hutang:false, lunas:true, tarikh_lunas:today(), dikemaskini_oleh:nama}); toast('✅ Ditanda lunas'); }
  catch(e){ onErr(e); }
}
window.AK = { padam, mulaEdit, tandaLunas, batal(){ editing=null; renderTab(); } };

// ---------- Kiraan ----------
function kira(list){
  const jualan = list.filter(e => e.jenis==='jualan');
  const beli   = list.filter(e => e.jenis==='pembelian');
  const belanja = list.filter(e => e.jenis==='belanja' || (e.jenis==='petty' && e.petty_arah==='keluar'));
  const jumJualan = sum(jualan, e => e.amaun), jumBeli = sum(beli, e => e.amaun), jumBelanja = sum(belanja, e => e.amaun);
  return { jualan, beli, belanja, jumJualan, jumBeli, jumBelanja, kasar: jumJualan-jumBeli, bersih: jumJualan-jumBeli-jumBelanja, kereta: sum(jualan, e => e.kereta) };
}
const bakiPetty = () => sum(pettyAll, e => e.petty_arah==='masuk' ? e.amaun : -e.amaun);
const groupBy = (list, key) => list.reduce((m,e) => (m[e[key]||'Lain-lain'] = (m[e[key]||'Lain-lain']||0) + (Number(e.amaun)||0), m), {});

// ---------- Paparan utama ----------
function renderCawangan(){
  const bar = $('#cawBar');
  bar.className = 'noprint' + (tab === 'Ringkasan' ? ' besar' : '');
  bar.innerHTML = CAWANGAN.map(c => `<button class="caw ${c.id===cawangan?'sel':''}" data-caw="${c.id}"><img src="${c.logo}" alt="${esc(c.nama)}"><div><b>${esc(c.nama)}</b><span>${c.id===cawangan?'✓ Sedang dipapar':'Tekan untuk tukar'}</span></div></button>`).join('');
  bar.querySelectorAll('[data-caw]').forEach(b => b.onclick = () => tukarCawangan(b.dataset.caw));
}
function tukarCawangan(id){
  if(id === cawangan) return;
  if(editing && !confirm('Rekod yang sedang diedit belum disimpan. Tukar cawangan?')) return;
  cawangan = id;
  try{ localStorage.setItem('akaun_cawangan', id); }catch(_){}
  COL = colFor(id);
  stopListeners();
  entri = []; pettyAll = []; hutangAll = []; editing = null; monthLoaded = false; dataError = '';
  startListeners();
  renderShell();
  toast('Cawangan: ' + namaCawangan());
}

function renderShell(){
  renderCawangan();
  $('#userBox').innerHTML = `<span class="synctag">👤 ${esc(nama)}</span> <button class="small" id="btnOut">Log Keluar</button>`;
  $('#btnOut').onclick = () => { if(confirm('Log keluar?')) signOut(auth); };
  $('#nav').innerHTML = (isOwner ? OWNER_TABS : TABS).map(t => `<button class="${t===tab?'active':''}" data-t="${t}">${t}</button>`).join('')
;
  $('#bulanBar').innerHTML = `<label for="pilihBulan" style="margin:0">📅 Bulan:</label><input type="month" id="pilihBulan" value="${bulan}" style="width:auto;flex:1;max-width:220px;margin:0;padding:8px">`;
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; editing = null; renderShell(); });
  $('#pilihBulan').onchange = e => { if(e.target.value){ bulan = e.target.value; subscribeBulan(); refresh(); } };
  renderTab();
}

function renderTab(){
  const f = ({Ringkasan:'', Jualan:formJualan, Pembelian:formPembelian, Belanja:formBelanja, 'Petty Cash':formPetty, Laporan:''})[tab];
  const alat = tab === 'Import' ? toolImport : isOwner && ({Jualan:toolJualanLS, 'Petty Cash':toolPettyLS})[tab];
  $('#app').innerHTML = `<div id="errBox"></div>${f ? f() : ''}${alat ? alat() : ''}<div id="dataBox"></div>`;
  if(f) pasangForm();
  if(alat) pasangAlat();
  refresh();
}

function refresh(){
  if(!user || !$('#dataBox') || !(isOwner ? OWNER_TABS : TABS).includes(tab)) return;
  $('#errBox').innerHTML = dataError ? `<div class="notice">⚠ ${esc(dataError)}</div>` : '';
  const r = ({Ringkasan:viewRingkasan, Jualan:()=>senarai('jualan'), Pembelian:viewPembelian, Belanja:()=>senarai('belanja'), 'Petty Cash':viewPetty, Import:()=>'', Pekerja:viewPekerja, Laporan:viewLaporan})[tab];
  $('#dataBox').innerHTML = r();
  if(tab === 'Pekerja') pasangPekerja();
  const csv = $('#btnCsv'); if(csv) csv.onclick = eksportCsv;
  const pr = $('#btnPrint'); if(pr) pr.onclick = () => window.print();
}

// ---------- Borang ----------
const D = () => editing?.data || {};
const tajukForm = (t) => `<div class="section-title"><h3>${editing ? '✏️ Edit ' : '➕ '}${t}</h3>${editing?'<button class="small" onclick="AK.batal()">Batal edit</button>':''}</div>`;

function formJualan(){
  const d = D();
  return `<div class="card">${tajukForm('Jualan Harian')}
    <div class="two">
      <div><label>Tarikh</label><input type="date" id="f_tarikh" value="${d.tarikh||today()}"></div>
      <div><label>Bilangan kenderaan dicuci</label><input type="number" inputmode="numeric" id="f_kereta" value="${d.kereta??''}" placeholder="cth: 35"></div>
      ${KAEDAH_JUALAN.map(([k,l]) => `<div><label>${l} (RM)</label><input type="number" inputmode="decimal" step="0.01" class="kaedah" id="f_${k}" value="${d[k]??''}" placeholder="0.00"></div>`).join('')}
    </div>
    <label>Catatan</label><input id="f_catatan" value="${esc(d.catatan||'')}" placeholder="cth: hari hujan, promosi, dll.">
    <div class="totalbox">Jumlah jualan: <span id="f_jumlah">RM 0.00</span></div>

function ringkasanTempoh(mingguan){
  const kumpulan = new Map();
  for(const rekod of entri){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(rekod.tarikh || '')) continue;
    const tarikh = new Date(rekod.tarikh + 'T00:00:00Z');
    if(!Number.isFinite(tarikh.getTime()) || tarikh.toISOString().slice(0,10) !== rekod.tarikh) continue;
    if(mingguan) tarikh.setUTCDate(tarikh.getUTCDate() - (tarikh.getUTCDay() + 6) % 7);
    const awal = tarikh.toISOString().slice(0,10);
    if(!kumpulan.has(awal)) kumpulan.set(awal, []);
    kumpulan.get(awal).push(rekod);
  }
  const baris = [...kumpulan].sort(([a], [b]) => a.localeCompare(b)).map(([awal, rekod]) => {
    const akhir = new Date(awal + 'T00:00:00Z');
    akhir.setUTCDate(akhir.getUTCDate() + 6);
    const label = mingguan ? `${fmtTarikh(awal)} – ${fmtTarikh(akhir.toISOString().slice(0,10))}` : fmtTarikh(awal);
    const k = kira(rekod);
    return `<tr><td>${label}</td><td class="r">${k.kereta}</td><td class="r">${RM(k.jumJualan)}</td><td class="r">${RM(k.jumBeli + k.jumBelanja)}</td><td class="r ${k.bersih < 0 ? 'neg' : 'pos'}">${RM(k.bersih)}</td></tr>`;
  }).join('');
  const tajuk = mingguan ? 'Ringkasan Mingguan' : 'Ringkasan Harian';
  return `<div class="card"><h3>${tajuk}</h3>
    ${mingguan ? '<p class="muted">Isnin–Ahad. Jumlah termasuk transaksi dalam bulan dipilih sahaja.</p>' : ''}
    ${baris ? `<div class="scroll"><table><tr><th>Tarikh</th><th>Kend.</th><th>Jualan</th><th>Perbelanjaan</th><th>Bersih</th></tr>${baris}</table></div>` : '<p class="muted">Tiada rekod.</p>'}
  </div>`;
}

function eksportCsv(){

  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const list = [...entri].sort((a,b) => (a.tarikh||'').localeCompare(b.tarikh||''));
  const csv = '﻿' + kol.join(',') + '\n' + list.map(e => kol.map(c => q(e[c])).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));

  document.body.appendChild(a); a.click(); a.remove();
}

// ================================================================
const lsDoc = () => doc(store, 'branches', cawangan);
const pad2 = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
let lsFormat = 'dmy';      // format tarikh telefon LionSafari: dmy (Malaysia) atau mdy (US)
let lsJualan = [], lsPetty = [];

// LionSafari simpan masa sebagai teks ikut tetapan telefon, cth "9/11/2026, 1:30:00 PM".
function tarikhLS(s){
  if(!s) return null;
  const m = String(s).match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m){ const d = new Date(s); return isNaN(d) ? null : {iso:isoDate(d), amb:false}; }
  let a = +m[1], b = +m[2], c = +m[3];
  if(a > 31) return {iso:`${a}-${pad2(b)}-${pad2(c)}`, amb:false};   // YYYY-MM-DD
  if(c < 100) c += 2000;
  let d, mo, amb = false;
  if(a > 12){ d = a; mo = b; }
  else if(b > 12){ mo = a; d = b; }
  else { amb = a !== b; if(lsFormat === 'dmy'){ d = a; mo = b; } else { mo = a; d = b; } }
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return {iso:`${c}-${pad2(mo)}-${pad2(d)}`, amb};
}

    for(const o of orders){
      const t = tarikhLS(o.paidAt || o.time);
      if(!t){ tanpaTarikh++; continue; }
      adaAmb = adaAmb || t.amb;
      const h = ikutHari[t.iso] ||= {tarikh:t.iso, tunai:0, qr:0, lain:0, kereta:0};
      const amt = Number(o.total) || 0;
      if(o.paid === 'Cash') h.tunai += amt; else if(o.paid === 'QR') h.qr += amt; else h.lain += amt;
      h.kereta++;
    }
    const sedia = (await getDocs(query(COL, where('jenis','==','jualan')))).docs.map(d => ({id:d.id, ...d.data()}));
    lsJualan = Object.values(ikutHari).sort((a,b) => b.tarikh.localeCompare(a.tarikh)).map(h => {

      const lama = sedia.find(e => e.tarikh === h.tarikh && e.sumber === 'lionsafari' && !e.auto);

      <p class="muted">"Ada rekod manual" tidak ditanda supaya jualan tidak dikira dua kali. Tanda jika mahu tambah juga.</p>

// Pembaca CSV ringkas (sokong koma/titik koma, tanda petik)
function bacaCSV(teks){
  teks = teks.replace(/^﻿/, '');
  const pemisah = (teks.split('\n')[0].split(';').length > teks.split('\n')[0].split(',').length) ? ';' : ',';
  const baris = []; let sel = '', row = [], petik = false;
  for(let i = 0; i < teks.length; i++){
    const c = teks[i];
    if(petik){ if(c === '"'){ if(teks[i+1] === '"'){ sel += '"'; i++; } else petik = false; } else sel += c; }
    else if(c === '"') petik = true;
    else if(c === pemisah){ row.push(sel); sel = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && teks[i+1] === '\n') i++; row.push(sel); baris.push(row); row = []; sel = ''; }
    else sel += c;
  }
  if(sel || row.length){ row.push(sel); baris.push(row); }
  const kepala = (baris.shift() || []).map(h => h.trim().toLowerCase().replace(/\s+/g,'_'));
  return baris.filter(r => r.some(x => String(x).trim())).map(r => Object.fromEntries(kepala.map((h,i) => [h, r[i] ?? ''])));
}

function tarikhImport(v){
  if(v instanceof Date && !isNaN(v)) return isoDate(new Date(v.getTime() + 12*3600*1000)); // elak anjakan zon masa
  if(typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Date.UTC(1899,11,30) + v*86400000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`; }
  const s = String(v || '').trim();
  const sah = (y,mo,d) => { const t = new Date(y, mo-1, d); return (t.getFullYear()===y && t.getMonth()===mo-1 && t.getDate()===d && y>=2000 && y<=2100) ? `${y}-${pad2(mo)}-${pad2(d)}` : null; };
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return sah(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m) return sah(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return null;
}
const nombor = v => { if(typeof v === 'number') return Math.round(v*100)/100; const n = parseFloat(String(v||'').replace(/rm/i,'').replace(/,/g,'').trim()); return isNaN(n) ? 0 : Math.round(n*100)/100; };
const cariSenarai = (list, v, lalai) => list.find(x => x.toLowerCase() === String(v||'').trim().toLowerCase()) || lalai;

function tukarBaris(r){
  const t = tarikhImport(r.tarikh);
  if(!t) return {ralat:'tarikh tidak sah ("' + (r.tarikh ?? '') + '")'};
  let jenis = String(r.jenis||'').trim().toLowerCase();
  if(jenis.startsWith('petty')) jenis = 'petty';
  if(!['jualan','pembelian','belanja','petty'].includes(jenis)) return {ralat:'jenis tidak dikenali ("' + (r.jenis ?? '') + '")'};
  const asas = {jenis, tarikh:t, bulan:t.slice(0,7), cawangan, perkara:String(r.perkara||'').trim(), catatan:String(r.catatan||'').trim(), sumber:'excel', hutang:false, guna_petty:false};
  if(jenis === 'jualan'){
    const d = {...asas}; KAEDAH_JUALAN.forEach(([k]) => d[k] = nombor(r[k]));
    let jum = sum(KAEDAH_JUALAN.map(([k]) => d[k]));
    if(!jum && nombor(r.amaun)){ d.lain = nombor(r.amaun); jum = d.lain; }
    d.amaun = Math.round(jum*100)/100; d.kereta = Math.round(nombor(r.kereta));
    return d.amaun > 0 ? {d} : {ralat:'jumlah jualan RM 0'};
  }
  const amaun = nombor(r.amaun);
  if(!(amaun > 0)) return {ralat:'amaun kosong / tidak sah'};
  if(jenis === 'petty'){
    const masuk = /^(masuk|top|tambah|in)/i.test(String(r.petty_arah||'').trim());
    return {d:{...asas, amaun, petty_arah: masuk ? 'masuk' : 'keluar', kategori: masuk ? 'Top-up' : cariSenarai(KAT_PETTY, r.kategori, 'Lain-lain'),
      perkara: asas.perkara || (masuk ? 'Top-up' : 'Belanja petty cash'), bayar:'Petty Cash', guna_petty:true}};
  }
  const bayar = cariSenarai(jenis === 'pembelian' ? CARA_BAYAR : CARA_BAYAR_B, r.bayar, 'Tunai');
  const d = {...asas, amaun, bayar, kategori: cariSenarai(jenis === 'pembelian' ? KAT_PEMBELIAN : KAT_BELANJA, r.kategori, 'Lain-lain'),
    guna_petty: bayar === 'Petty Cash', petty_arah: bayar === 'Petty Cash' ? 'keluar' : null};
  if(jenis === 'pembelian'){ d.pembekal = String(r.pembekal||'').trim(); d.invois = String(r.invois||'').trim(); d.hutang = bayar === 'Kredit (Hutang)'; d.lunas = false; }
  if(!d.perkara) d.perkara = d.kategori;
  return {d};
}

async function bacaFailImport(fail){
  const box = $('#importBox'); box.innerHTML = '<p class="muted">Membaca fail…</p>';
  try{
    let rows;
    if(/\.csv$/i.test(fail.name)) rows = bacaCSV(await fail.text());
    else {
      const X = await muatXLSX().catch(() => { throw new Error('Gagal memuat pembaca Excel (semak internet). Cuba simpan fail sebagai CSV dan import semula.'); });
      const wb = X.read(await fail.arrayBuffer(), {cellDates:true});
      const nm = wb.SheetNames.find(n => n.toLowerCase() === 'data') || wb.SheetNames.find(n => n.toLowerCase() !== 'panduan') || wb.SheetNames[0];
      rows = X.utils.sheet_to_json(wb.Sheets[nm], {defval:'', raw:true})
        .map(r => Object.fromEntries(Object.entries(r).map(([k,v]) => [k.trim().toLowerCase().replace(/\s+/g,'_'), v])));
    }
    if(!rows.length) throw new Error('Fail kosong atau tiada baris data.');
    const hasil = rows.map((r,i) => ({...tukarBaris(r), baris:i+2}));
    const ok = hasil.filter(h => h.d), salah = hasil.filter(h => h.ralat);
    // semak pendua dengan rekod sedia ada dalam bulan berkaitan
    const bulanSet = [...new Set(ok.map(h => h.d.bulan))];
    const sedia = [];
    for(const b of bulanSet) (await getDocs(entryQuery(where('bulan','==',b)))).docs.forEach(x => sedia.push(x.data()));
    const kunci = e => `${e.tarikh}|${e.jenis}|${Number(e.amaun).toFixed(2)}|${(e.perkara||'').toLowerCase()}`;
    const ada = new Set(sedia.map(kunci));
    ok.forEach(h => h.pendua = ada.has(kunci(h.d)));
    const kiraanFail = {}; ok.forEach(h => kiraanFail[kunci(h.d)] = (kiraanFail[kunci(h.d)]||0) + 1);
    const samaDalamFail = ok.filter(h => !h.pendua && kiraanFail[kunci(h.d)] > 1).map(h => h.baris);
    importRows = ok;
    const baru = ok.filter(h => !h.pendua);
    const jenisList = ['jualan','pembelian','belanja','petty'];
    box.innerHTML = `<hr style="border:0;border-top:1px solid #e5e7eb;margin:12px 0">
      <p><b>${esc(fail.name)}</b> — ${rows.length} baris dibaca</p>
      <table>${jenisList.map(j => { const l = baru.filter(h => h.d.jenis === j); return l.length ? `<tr><td>${j[0].toUpperCase()+j.slice(1)}</td><td class="r">${l.length} rekod</td><td class="r">${RM(sum(l,h=>h.d.amaun))}</td></tr>` : ''; }).join('')}</table>
      ${ok.length - baru.length ? `<p class="muted">${ok.length - baru.length} rekod sudah wujud dalam Akaun (sama tarikh, jenis, amaun & perkara) — akan dilangkau.</p>` : ''}
      ${samaDalamFail.length ? `<div class="notice">Baris ${samaDalamFail.join(', ')} adalah sama (tarikh, jenis, amaun & perkara). Semua akan diimport — padam dari fail jika ia berulang secara tidak sengaja.</div>` : ''}
      ${salah.length ? `<div class="notice"><b>${salah.length} baris ada masalah & tidak akan diimport:</b><br>${salah.slice(0,10).map(h => `Baris ${h.baris}: ${esc(h.ralat)}`).join('<br>')}${salah.length > 10 ? `<br>…dan ${salah.length-10} lagi` : ''}</div>` : ''}
      ${baru.length ? `<details style="margin:8px 0"><summary class="muted">Lihat ${Math.min(baru.length,30)} rekod pertama</summary><div class="scroll"><table>
        ${baru.slice(0,30).map(h => `<tr><td>${fmtTarikh(h.d.tarikh)} ${h.d.tarikh.slice(0,4)}</td><td><span class="tag">${h.d.jenis}</span> ${esc(h.d.perkara||h.d.catatan||'')}</td><td class="r">${RM(h.d.amaun)}</td></tr>`).join('')}</table></div></details>
        <button class="primary" style="width:100%;padding:13px" id="btnImport">Import ${baru.length} rekod</button>` : '<p><b>Tiada rekod baru untuk diimport.</b></p>'}`;
    if($('#btnImport')) $('#btnImport').onclick = simpanImport;
  }catch(e){ box.innerHTML = `<p class="neg">⚠ ${esc(e.message)}</p>`; }
  $('#fImport').value = '';
}

async function simpanImport(){
  const baru = importRows.filter(h => !h.pendua).map(h => h.d);
  if(!confirm(`Import ${baru.length} rekod ke dalam Akaun Mama Lion?`)) return;
  const btn = $('#btnImport'); btn.disabled = true;
  try{
    for(let i = 0; i < baru.length; i += 400){
      btn.textContent = `Menyimpan ${Math.min(i+400, baru.length)}/${baru.length}…`;
      const batch = writeBatch(store);
      baru.slice(i, i+400).forEach(d => batch.set(doc(COL), {...d, assignedUid:user.uid, oleh:nama, dicipta:serverTimestamp()}));
      await batch.commit();
    }
    toast(`✅ ${baru.length} rekod diimport`);
    importRows = [];
    $('#importBox').innerHTML = `<p class="pos"><b>✅ ${baru.length} rekod berjaya diimport.</b> Tukar bulan di atas untuk melihat rekod bulan lain.</p>`;
  }catch(e){ onErr(e); btn.disabled = false; btn.textContent = 'Cuba lagi'; }
}

// ================================================================
// PEKERJA — ID, peranan & PIN kaunter + rekod gaji, advance, OT
// ================================================================
// Login kaunter (Lion Safari V2): lionsafari/{cawangan}/staf/{id}  {nama, idStaf, peranan, aktif, pinHash}
// Maklumat peribadi & gaji (pemilik sahaja): akaun/{cawangan}/pekerja/{id}
// Rekod advance / OT / elaun / potongan:      akaun/{cawangan}/hr/{auto}
const PERANAN_KAUNTER = ['Admin','Manager','Supervisor','Cashier','Pekerja'];
const KET_PERANAN = {Admin:'semua termasuk Tetapan kaunter', Manager:'semua kecuali Tetapan', Supervisor:'kaunter + laporan + kelulusan', Cashier:'order, bayaran, petty cash, stok', Pekerja:'queue & stok (staf bay)'};
const PERANAN_LAMA = {'Pengurus':'Admin', 'Juruwang':'Cashier'};
const JENIS_HR = {
  advance:  {label:'Advance (pendahuluan gaji)', ikon:'💸', tolak:true},
  ot:       {label:'Overtime (OT)', ikon:'⏱', tolak:false},
  elaun:    {label:'Elaun', ikon:'🎁', tolak:false},
  komisen:  {label:'Komisen / Bonus', ikon:'🏆', tolak:false},
  hari:     {label:'Hari bekerja (gaji harian)', ikon:'📅', tolak:false},
  potongan: {label:'Potongan (lewat, rosak, dll.)', ikon:'➖', tolak:true}
};
let stafKaunter = [], pekerjaInfo = {}, hrBulan = [], hrError = '', pkMod = 'Senarai';
const stafCol = () => collection(store, 'lionsafari', cawangan, 'staf');
const pekerjaCol = () => collection(store, 'akaun', cawangan, 'pekerja');
const hrCol = () => collection(store, 'akaun', cawangan, 'hr');
const modulPK = modulPengurusan({store, fs:{collection, doc, query, where, onSnapshot, getDoc, getDocs, setDoc, updateDoc, serverTimestamp},
  cawangan: () => cawangan, pengguna: () => nama, esc, RM, toast, refresh: () => refresh(), kehadiranBulan: true});
document.head.insertAdjacentHTML('beforeend', `<style>${CSS_MODUL}</style>`);
const MOD_KM = ['Kehadiran','Permohonan','Roster','Tetapan Pekerja'];
function onErrHR(e){ console.error(e); hrError = e.code === 'permission-denied' ? 'Firebase menolak akses rekod pekerja — Firestore Rules perlu dikemas kini (blok "pekerja" & "hr").' : 'Ralat: ' + e.message; refresh(); }
function mulaHR(){
  unsubHR.forEach(f => f && f()); unsubHR = []; hrError = ''; stafKaunter = []; pekerjaInfo = {};
  modulPK.mula(bulan);
  unsubHR.push(onSnapshot(stafCol(), s => { stafKaunter = s.docs.map(d => { const x = {id:d.id, ...d.data()}; x.peranan = PERANAN_LAMA[x.peranan] || x.peranan; return x; }); refresh(); }, onErrHR));
  unsubHR.push(onSnapshot(pekerjaCol(), s => { pekerjaInfo = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); refresh(); }, onErrHR));
}
function langganHRBulan(){
  if(unsubHRBulan) unsubHRBulan();
  hrBulan = [];
  modulPK.setBulan(bulan);
  unsubHRBulan = onSnapshot(query(hrCol(), where('bulan','==',bulan)), s => { hrBulan = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.tarikh||'').localeCompare(a.tarikh||'')); refresh(); }, onErrHR);
}
async function hashPin(id, pin){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`lionsafari:${id}:${pin}`));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
const awalanId = () => cawangan === 'lion-king' ? 'LK' : 'ML';
function idSeterus(){
  const a = awalanId(), n = Math.max(0, ...stafKaunter.map(x => { const m = String(x.idStaf||'').match(new RegExp('^' + a + '-?(\\d+)$', 'i')); return m ? +m[1] : 0; }));
  return a + String(n + 1).padStart(3,'0');
}
const tahap = r => ({Admin:4, Manager:3, Supervisor:2, Cashier:1, Pekerja:0})[r] ?? 0;
const senaraiPekerja = () => stafKaunter.map(s => ({...s, info: pekerjaInfo[s.id] || {}})).sort((a,b) => (b.aktif!==false) - (a.aktif!==false) || String(a.idStaf||'zz').localeCompare(String(b.idStaf||'zz')));

function kiraGaji(p){
  const r = hrBulan.filter(h => h.stafId === p.id), j = k => sum(r.filter(h => h.jenis === k), h => h.amaun);
  const info = p.info, harian = info.jenisGaji === 'Harian';
  const hari = sum(r.filter(h => h.jenis === 'hari'), h => h.hari);
  const asas = harian ? Math.round((Number(info.kadarHarian)||0) * hari * 100)/100 : (Number(info.gajiBulanan)||0);
  const pk = modulPK.ringkasStaf(p.id);                       // dari Apps Pekerja (diluluskan) & punch in/out
  const otApps = Math.round(pk.otJam * (Number(info.kadarOT)||0) * 100)/100;
  const ot = j('ot') + otApps, elaun = j('elaun'), komisen = j('komisen'), potongan = j('potongan'), advance = j('advance') + pk.advance, claim = pk.claim;
  const kasar = asas + ot + elaun + komisen + claim;
  return {r, harian, hari, asas, ot, otJam: sum(r.filter(h => h.jenis === 'ot'), h => h.jam) + pk.otJam, elaun, komisen, claim, potongan, advance, kasar, bersih: kasar - potongan - advance, pk};
}

  const draw = () => {
    const j = val('#hJenis');
    $('#hBox').innerHTML = j === 'ot' ? `<div class="two"><div><label>Jam OT</label><input id="hJam" type="number" inputmode="decimal" step="0.5"></div><div><label>Kadar (RM / jam)</label><input id="hKadar" type="number" inputmode="decimal" step="0.01" value="${p.info.kadarOT||''}"></div></div>`
      : j === 'hari' ? `<label>Bilangan hari bekerja</label><input id="hHari" type="number" inputmode="decimal" step="0.5" value="1"><div class="muted" style="margin:-6px 0 8px">Kadar harian: ${RM(p.info.kadarHarian)} ${p.info.jenisGaji!=='Harian'?'(pekerja ini bergaji bulanan — rekod hari tidak menambah gaji)':''}</div>`
      : `<label>Amaun (RM)</label><input id="hAmaun" type="number" inputmode="decimal" step="0.01">`;
    $$('#hBox input').forEach(x => x.oninput = jum); jum();
  };
  const jum = () => { const j = val('#hJenis'); const a = j === 'ot' ? num('#hJam') * num('#hKadar') : j === 'hari' ? num('#hHari') * (Number(p.info.kadarHarian)||0) : num('#hAmaun');
    $('#hJum').textContent = j === 'hari' ? `Nilai: ${RM(a)}` : `Amaun: ${RM(a)}${JENIS_HR[j].tolak ? ' (ditolak dari gaji)' : ''}`; return Math.round(a*100)/100; };
  draw(); $('#hJenis').onchange = draw; $('#mTutup').onclick = tutupModal;
  $('#hSimpan').onclick = async () => {
    const j = val('#hJenis'), tarikh = val('#hTarikh'); if(!tarikh) return toast('Sila pilih tarikh');
    const d = {stafId:p.id, idStaf:p.idStaf||'', nama:p.nama, jenis:j, tarikh, bulan:tarikh.slice(0,7), cawangan, catatan:val('#hCatatan'), oleh:nama, dicipta:serverTimestamp()};
    if(j === 'ot'){ d.jam = num('#hJam'); d.kadar = num('#hKadar'); if(!(d.jam > 0)) return toast('Sila isi jam OT'); d.amaun = Math.round(d.jam*d.kadar*100)/100; }
    else if(j === 'hari'){ d.hari = num('#hHari'); if(!(d.hari > 0)) return toast('Sila isi bilangan hari'); d.amaun = 0; }
    else { d.amaun = num('#hAmaun'); if(!(d.amaun > 0)) return toast('Sila isi amaun'); }
    $('#hSimpan').disabled = true;
    try{ await addDoc(hrCol(), d); tutupModal(); toast('✅ Rekod disimpan' + (d.bulan !== bulan ? ` (bulan ${fmtBulan(d.bulan)})` : '')); }
    catch(e){ onErrHR(e); toast('⚠ Gagal: ' + (e.code || e.message)); $('#hSimpan').disabled = false; }
  };
}

async function rekodGajiBelanja(id){
  const p = senaraiPekerja().find(x => x.id === id); if(!p) return;
  const g = kiraGaji(p), kos = Math.round((g.kasar - g.potongan)*100)/100;
  if(!(kos > 0)) return toast('Tiada kos gaji untuk direkod');
  if(!confirm(`Rekod kos gaji ${p.nama} (${fmtBulan(bulan)}) ${RM(kos)} ke Belanja "Gaji & Upah"?\nBersih dibayar: ${RM(g.bersih)} (selepas advance ${RM(g.advance)}).`)) return;
  const akhir = new Date(+bulan.slice(0,4), +bulan.slice(5,7), 0).getDate();
  const tarikh = bulan === today().slice(0,7) ? today() : `${bulan}-${String(akhir).padStart(2,'0')}`;
  try{
    await setDoc(doc(COL, `gaji-${p.id}-${bulan}`), {jenis:'belanja', tarikh, bulan, cawangan, kategori:'Gaji & Upah', perkara:`Gaji ${p.nama} (${p.idStaf||''}) ${fmtBulan(bulan)}`,
      amaun:kos, bayar:'Bank / Transfer', guna_petty:false, hutang:false, petty_arah:null, sumber:'gaji',
      catatan:`Asas ${RM(g.asas)} + OT ${RM(g.ot)} + Elaun ${RM(g.elaun)} + Komisen ${RM(g.komisen)} + Claim ${RM(g.claim)} − Potongan ${RM(g.potongan)}; Advance ${RM(g.advance)}; Bersih ${RM(g.bersih)}`,
      assignedUid:user.uid, oleh:nama, dicipta:serverTimestamp()});
    toast('✅ Kos gaji direkod ke Belanja');
  }catch(e){ onErr(e); }
}

function csvGaji(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const kol = ['ID','Nama','Jawatan','Jenis gaji','Hari hadir','Jam kerja','Lewat (kali)','Gaji asas','OT jam','OT','Elaun','Komisen','Claim','Potongan','Advance','Bersih','Bank'];
  const rows = senaraiPekerja().filter(p => p.aktif !== false || kiraGaji(p).r.length).map(p => { const g = kiraGaji(p); return [p.idStaf, p.nama, p.info.jawatan, p.info.jenisGaji||'Bulanan', g.pk.hariHadir || g.hari || '', (g.pk.minit/60).toFixed(1), g.pk.lewatKali, g.asas, g.otJam||'', g.ot, g.elaun, g.komisen, g.claim, g.potongan, g.advance, g.bersih, p.info.bank]; });
  const csv = '﻿' + kol.join(',') + '\n' + rows.map(r => r.map(q).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = `gaji-${cawangan}-${bulan}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Toast ----------
function toast(msg){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90%;text-align:center'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display='none', 2600);
}
// ---------- Pasang apps di telefon ----------
let pasangPrompt = null;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function renderPasang(){
  const box = $('#pasangBox');
  if(standalone() || (()=>{ try{ return localStorage.getItem('akaun_pasang_tutup') === '1'; }catch(_){ return false; } })()){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="card"><div class="section-title" style="margin:0"><b>📲 Pasang Akaun Mama Lion di telefon ini</b>
    <div class="row"><button class="btn-gold small" id="btnPasang">PASANG SEKARANG</button><button class="small" id="btnTutupPasang">Nanti</button></div></div>
    <div class="muted" id="pasangInfo" style="margin-top:6px">${iOS ? 'iPhone/iPad: buka dalam Safari → butang Kongsi ⬆ → "Add to Home Screen".' : 'Ikon Akaun akan muncul di skrin utama dan dibuka seperti apps biasa (tanpa bar pelayar).'}</div></div>`;
  $('#btnPasang').onclick = async () => {
    if(pasangPrompt){ pasangPrompt.prompt(); const r = await pasangPrompt.userChoice; pasangPrompt = null; if(r.outcome === 'accepted') box.innerHTML = ''; }
    else $('#pasangInfo').innerHTML = iOS
      ? '<b>iPhone/iPad:</b> mesti buka link ini dalam <b>Safari</b> → tekan butang Kongsi ⬆ di bawah skrin → <b>Add to Home Screen</b> → Add.'
      : '<b>Android (Chrome):</b> tekan menu ⋮ di atas kanan → <b>Install app</b> / <b>Add to Home screen</b> → Install.';
  };
  $('#btnTutupPasang').onclick = () => { try{ localStorage.setItem('akaun_pasang_tutup','1'); }catch(_){} box.innerHTML = ''; };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pasangPrompt = e; renderPasang(); });
window.addEventListener('appinstalled', () => { pasangPrompt = null; $('#pasangBox').innerHTML = ''; toast('✅ Akaun Mama Lion dipasang di skrin utama'); });
renderPasang();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
