<script>
// Penyelamat: jika apps tersangkut "Memuatkan…" (fail lama dalam cache telefon), muat semula versi terbaru
setTimeout(function(){
  var a = document.getElementById('app');
  if(!a || !/^\s*Memuatkan…\s*$/.test(a.innerText || '')) return;
  a.innerHTML = '<div class="card" style="padding:16px"><b>Apps tidak dapat dimuatkan.</b><p style="color:#64748b">Mungkin versi lama tersimpan dalam telefon. Tekan butang di bawah untuk memuat versi terkini.</p><button id="btnPulih" style="width:100%;padding:14px;border:0;border-radius:12px;background:#14532d;color:#fff;font-weight:700;font-size:16px">🔄 MUAT VERSI TERKINI</button></div>';
  document.getElementById('btnPulih').onclick = function(){
    var p = [];
    if(window.caches) p.push(caches.keys().then(function(k){ return Promise.all(k.map(function(x){ return caches.delete(x); })); }));
    if(navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(r){ return Promise.all(r.map(function(x){ return x.unregister(); })); }));
    Promise.all(p).catch(function(){}).then(function(){ location.replace(location.pathname + '?v=' + Date.now()); });
  };
}, 9000);
</script>

function keypad(boxSel, onDone, label=''){
  let pin = '';
  const box = $(boxSel);
  const draw = (msg='') => {
    box.innerHTML = `${label}<div class="pindots">${[0,1,2,3,4,5].map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
      <div class="neg" style="text-align:center;font-size:13px;min-height:18px">${esc(msg)}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="btn-gold">OK</button></div>`;
    box.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      const k = b.dataset.k;
      if(k === 'del') pin = pin.slice(0,-1);
      else if(k === 'ok'){ if(pin.length < 4) return draw('PIN 4–6 digit'); const p = pin; pin = ''; const m = await onDone(p); if(m) return draw(m); return; }
      else if(pin.length < 6) pin += k;
      draw();
    });
  };
  draw();
}

function bannerTutup(){

function kemasBanner(){ const e = $('#errBox'); if(!e) return; const h = (dataError ? `<div class="notice bad">⚠ ${esc(dataError)}</div>` : '') + bannerTutup(); if(e._h !== h){ e._h = h; e.innerHTML = h; pasangBannerTutup(); } }

function semakSekatPagi(){
  if(!staf || $('#sekatTutup') || !semalamAdaJualan || sudahTutup(tutupSemalam) || lepasTengahMalam() || sudahTeruskan()) return;
  const t = kelmarin(), bolehTutup = tabsStaf(staf).includes('Tutup Kaunter');

  ov.innerHTML = `<div class="box" style="text-align:center"><div style="font-size:46px">📋</div><h3>Laporan ${esc(fTarikh(t))} belum ditutup</h3>

    ${bolehTutup ? `<button class="btn-gold big" style="width:100%" id="stTutup">🔐 Tutup kaunter ${esc(fTarikh(t))} sekarang</button>` : ''}

    <p class="muted" style="font-size:12px">"Teruskan" direkod dengan nama pelulus & sebab, dan laporan semalam ditanda "Tutup lewat".</p></div>`;
  document.body.appendChild(ov);
  const st = $('#stTutup'); if(st) st.onclick = () => { ov.remove(); tab = 'Tutup Kaunter'; MT.mula(t); renderShell(); };
  $('#stTeruskan').onclick = async () => {
    ov.classList.add('hidden');

    if(!oleh){ ov.classList.remove('hidden'); return; }
    const sebab = (prompt('Sebab kaunter semalam belum ditutup?') || '').trim();
    if(!sebab){ ov.classList.remove('hidden'); return toast('Sila isi sebab'); }
    try{
      await setDoc(doc(col('tutup'), t), {tarikh: t, bulan: t.slice(0,7), cawangan, status: tutupSemalam?.status || 'draf', lewat: true, lewatSebab: sebab, lewatLulus: oleh, lewatMasa: Date.now(), lewatStaf: staf.nama, dikemaskini: Date.now()}, {merge: true});
      try{ localStorage.setItem(kunciTeruskan(), '1'); }catch(_){}
      ov.remove(); toast(`✅ Diteruskan — diluluskan ${oleh}`);
    }catch(e){ ov.classList.remove('hidden'); toast('⚠ ' + (e.code || e.message)); }

}

function langganHari(){
  stopAll(unsubHari);
  hari = today();
  tutupKini = null; tutupSemalam = null; semalamAdaJualan = false;
  unsubHari.push(onSnapshot(doc(col('tutup'), hari), s => { tutupKini = s.exists() ? s.data() : null; refreshLive(); }, () => {}));
  unsubHari.push(onSnapshot(doc(col('tutup'), kelmarin()), s => { tutupSemalam = s.exists() ? s.data() : null; if(sudahTutup(tutupSemalam)) $('#sekatTutup')?.remove(); refreshLive(); semakSekatPagi(); }, () => {}));
  getDocs(query(col('order'), where('tarikhBayar','==',kelmarin()))).then(r => { semalamAdaJualan = r.docs.some(d => d.data().status !== 'Batal'); refreshLive(); semakSekatPagi(); }).catch(() => {});
  segerakMasukAhli();
  unsubHari.push(onSnapshot(query(col('order'), where('aktif','==',true)), s => {
    const lama = Object.fromEntries(aktif.map(o => [o.id, o.diskaunBeri?.masa || 0]));
    aktif = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.masaDibuat||0)-(b.masaDibuat||0));
    aktif.forEach(o => { if(o.id in lama && o.diskaunBeri && o.diskaunBeri.masa !== lama[o.id]) bunyiMaklum(`🎟 Diskaun ${o.plat}`, labelDiskaun(o.diskaunBeri)); });
    refreshLive(); if(kemasBayar) kemasBayar(); }, onErr));
  unsubHari.push(onSnapshot(query(col('foto_keadaan'), where('tarikh','==',today())), s => { fotoK = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.masa||0)-(b.masa||0)); refreshLive(); }, () => {}));
  unsubHari.push(onSnapshot(query(col('bayar_pelanggan'), where('status','==','menunggu')), s => {
    const lama = new Set(bayarPel.map(x => x.id)), awal = !bayarPelMula; bayarPelMula = true;
    bayarPel = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.masaPeranti||0)-(b.masaPeranti||0));
    if(!awal) bayarPel.filter(x => !lama.has(x.id)).forEach(x => bunyiMaklum('📲 Pelanggan telah bayar', `${x.plat} — ${RM(x.jumlah)} (${x.kaedah}). Sila semak.`));
    refreshLive(); renderNav(); }, () => {}));
  unsubHari.push(onSnapshot(query(col('order'), where('tarikh','==',hari)), s => { dibuatHari = s.docs.map(d => ({id:d.id, ...d.data()})); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(query(col('order'), where('tarikhBayar','==',hari)), s => { bayarHari = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.masaBayar||0)-(a.masaBayar||0)); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(col('stok'), s => { stok = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => a.nama.localeCompare(b.nama)); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(query(col('tempahan'), where('status','==','baru')), s => {
    const lama = new Set(tempahan.map(t => t.id)); tempahan = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.masa||0)-(b.masa||0));
    if(lama.size || tempahan.length) tempahan.filter(t => !lama.has(t.id)).forEach(t => { if(lama.size) toast(`📲 Tempahan baru: ${t.plat} — ${t.pakej}`); });
    refreshLive(); renderNav(); }, () => {}));
  unsubHari.push(onSnapshot(col('petty'), s => { petty = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.masa||0)-(a.masa||0)); refreshLive(); }, onErr));
}

function mintaLulus(sebab){
  return new Promise(resolve => {
    const ov = $('#lulus');
    ov.classList.remove('hidden');
    $('#lulusBox').innerHTML = `<div style="text-align:center"><h3>🔐 KELULUSAN DIPERLUKAN</h3><div class="notice">${esc(sebab)}</div>
      <div class="muted">PIN Supervisor / Manager / Admin</div><div id="kpL"></div><button class="small" id="btnTolak">Batal</button></div>`;
    const tutup = v => { ov.classList.add('hidden'); resolve(v); };
    $('#btnTolak').onclick = () => tutup(null);
    keypad('#kpL', async pin => {
      for(const s of stafList.filter(x => PELULUS.includes(x.peranan) && x.aktif !== false))
        if(await hashPin(s.id, pin) === s.pinHash){ tutup(s.nama); return; }
      return 'PIN tidak sah / tiada kuasa kelulusan';
    });
  });
}
const perluLulus = async sebab => PELULUS.includes(staf.peranan) ? staf.nama : await mintaLulus(sebab);
// PIN pekerja berkuasa (Supervisor / Manager / Admin atau kuasa 🏷 Harga) — sentiasa diminta
function mintaPinHarga(sebab){
  return new Promise(resolve => {
    const ov = $('#lulus'); ov.classList.remove('hidden');
    $('#lulusBox').innerHTML = `<div style="text-align:center"><h3>🔐 PIN PEMBETULAN HARGA</h3><div class="notice">${esc(sebab)}</div>
      <div class="muted">PIN Supervisor / Manager / Admin atau pekerja berkuasa 🏷 Harga</div><div id="kpH"></div><button class="small" id="btnTolakH">Batal</button></div>`;
    const tutup = v => { ov.classList.add('hidden'); resolve(v); };
    $('#btnTolakH').onclick = () => tutup(null);
    keypad('#kpH', async pin => {
      for(const x of stafList.filter(x => x.aktif !== false && (PELULUS.includes(x.peranan) || adaKuasa(x, 'harga'))))
        if(await hashPin(x.id, pin) === x.pinHash){ tutup(x); return; }
      return 'PIN tidak sah / tiada kuasa pembetulan harga';
    });
  });
}

function badge(t){
  if(t === 'Queue' && (aktif.length || tempahan.length)) return aktif.length + tempahan.length;
  if(t === 'Bayaran'){ const n = aktif.filter(o => o.status === 'Siap').length + bayarPel.length; if(n) return n; }
  if(t === 'Pekerja'){ const n = modulPK.st.menunggu.filter(m => modulPK_bolehLulus(m)).length; if(n) return n; }
  if(t === 'Stok'){ const n = stok.filter(s => (s.baki||0) <= (s.min||0)).length; if(n) return n; }
  return 0;
}

async function kemaskiniAkaunHari(tarikh){
  try{
    const s = await getDocs(query(col('order'), where('tarikhBayar','==',tarikh)));
    const paid = s.docs.map(d => d.data()).filter(o => o.status !== 'Batal' && o.bayar);
    const ref = doc(akaunCol(), 'ls-' + tarikh);
    if(!paid.length){ await deleteDoc(ref).catch(() => {}); return; }
    const by = k => r2(sum(paid.filter(o => o.bayar.kaedah === k), o => o.jumlah));

  pasang(){

        draf[key] = i; $$(`${box} .choice`).forEach(x => x.classList.toggle('sel', x === b));

          <button class="small" id="oLepas">✕</button></div>
          <div class="copbar">${Array.from({length:KAD.saiz}, (_,i) => `<i class="${i < k.bil ? 'on' : ''} ${KAD.ganjaranPada.includes(i+1) ? 'g' : ''}"></i>`).join('')}<span>${k.bil}/${KAD.saiz}</span></div>
          ${!k.aktif ? `<div style="color:#fbbf24;margin:4px 0">🔓 Kad belum aktif — cop pertama perlu pakej ${esc(KAD.pakejAktif.map(id => aktifSahaja('pakej').find(p => p.id === id)?.nama || id).join(' / ') || 'berbayar')}${k.profilKurang.length ? ` & pelanggan lengkapkan profil (${k.profilKurang.map(m => MEDAN_PROFIL[m]).join(', ')}) dalam Apps Pelanggan` : ''}.</div>` : ''}
          ${k.freeWash.length ? `<label class="fwtoggle"><input type="checkbox" id="oFW" ${draf.fw ? 'checked' : ''}> 🎁 Guna Free Wash (${k.freeWash.length} ada) — pakej ${esc(fwp?.nama || '')}</label>` : `<div class="muted" style="color:#cbd5e1">Lagi ${k.lagiUntukGanjaran} cop untuk Free Wash</div>`}</div>`;
        $('#oLepas').onclick = () => { draf.ahli = null; draf.fw = null; lukisAhli(); lukisDaftar(); kira(); };
        if($('#oFW')) $('#oFW').onchange = e => {
          if(e.target.checked){
            const i = L.pakej.findIndex(p => p.id === fwp?.id);
            if(i < 0){ e.target.checked = false; return toast('Pakej Free Wash belum ditetapkan dalam Tetapan'); }
            draf.fw = {fwId: k.freeWash.sort((x,y) => x.tamat - y.tamat)[0].id}; draf.pakej = i;
            $$('#cPakej .choice').forEach((x,j) => x.classList.toggle('sel', j === i));

    lukisDaftar(); kira();

    // ---- Gambar ----
    const thumb = (id, src) => { const el = $(id); el.classList.add('ada'); el.style.backgroundImage = `url(${src})`; };

      const fw = draf.fw && draf.ahli ? {fwId: draf.fw.fwId, nilai: r2(hp)} : null;
      const kasar = r2((fw ? 0 : hp) + sum(addon, a => a.harga));
      const sales = staf.peranan === 'Sales';
      const komisen = sales ? r2((fw ? 0 : Number(KOMISEN[p.id])||0) + sum(addon, a => Number(KOMISEN[a.id])||0)) : 0;
      const t = today();
      const no = `${t.slice(5,7)}${t.slice(8,10)}-${pad(dibuatHari.length + 1, 3)}`;

// Selepas order disimpan: kongsi ke WhatsApp (pilihan)
function selepasOrder(o, foto){
  const teks = `🦁 *${infoCaw().nama}* — Order ${o.no}\nPlat: *${o.plat}* (${o.kenderaan})\nPakej: ${o.pakej}${o.freeWash ? ' 🎁 FREE WASH' : ''}${(o.addon||[]).length ? '\nAdd-on: ' + o.addon.map(a => a.nama).join(', ') : ''}\nJumlah: ${RM(o.jumlah)}\nPelanggan: ${o.nama}${o.ahli ? ' ⭐ ' + o.ahli.kod : ''}\nBay: ${o.bay}\nOleh: ${staf.nama}${o.catatan ? '\nCatatan: ' + o.catatan : ''}`;
  openModal(`<div style="text-align:center"><h3>✅ Order ${esc(o.no)} disimpan</h3><div class="plate" style="font-size:22px">${esc(o.plat)}</div>
    <div class="fotothumbs" style="justify-content:center;margin:10px 0"><img src="${foto.plat}"><img src="${foto.emblem}">${foto.calar.map(c => `<img src="${c}">`).join('')}</div>
    <div class="muted">Order sudah masuk ke Queue & Bayaran kaunter.</div>
    <button class="btn-ok big" id="mWa" style="margin-top:10px">📤 Kongsi ke WhatsApp group</button>
    <button class="big" id="mOk" style="margin-top:8px">Order seterusnya</button></div>`);
  $('#mOk').onclick = () => { closeModal(); renderShell(); };
  $('#mWa').onclick = async () => {
    try{
      const fail = await Promise.all([foto.plat, foto.emblem, ...foto.calar].map(async (d,i) => new File([await (await fetch(d)).blob()], `${normPlat(o.plat)}-${i+1}.jpg`, {type:'image/jpeg'})));
      if(navigator.canShare && navigator.canShare({files: fail})) await navigator.share({files: fail, text: teks});
      else window.open('https://wa.me/?text=' + encodeURIComponent(teks), '_blank');
    }catch(e){ if(e.name !== 'AbortError') window.open('https://wa.me/?text=' + encodeURIComponent(teks), '_blank'); }
  };
}

// Imbas QR kad ahli (kamera belakang)
async function imbasKod(onKod){
  if(!('BarcodeDetector' in window)){ const k = prompt('Telefon ini tidak boleh imbas QR. Taip kod ahli (cth SMAB12CD):'); if(k) onKod(k.trim().toUpperCase()); return; }
  let strim, henti = false;
  openModal(`<div style="text-align:center"><h3>📷 Imbas kad Safari Members</h3><video id="mVid" playsinline muted style="width:100%;border-radius:12px;background:#000"></video>
    <button class="big" id="mTutupImbas" style="margin-top:8px">Batal</button></div>`);
  const tutup = () => { henti = true; strim?.getTracks().forEach(t => t.stop()); closeModal(); };
  $('#mTutupImbas').onclick = tutup;
  try{
    strim = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v = $('#mVid'); v.srcObject = strim; await v.play();
    const det = new BarcodeDetector({formats:['qr_code']});
    const loop = async () => { if(henti) return; try{ const r = await det.detect(v); const t = r[0]?.rawValue || ''; const m = t.match(/SM[A-Z0-9]{6}/);
      if(m){ tutup(); onKod(m[0]); return; } }catch(_){} requestAnimationFrame(loop); };
    loop();
  }catch(e){ tutup(); toast('Kamera tidak dapat dibuka: ' + e.message); }
}

// Gambar order (dimuat bila dipapar)
async function muatGambarOrder(){
  for(const im of $$('[data-og]')){
    const [id, jenis] = im.dataset.og.split('|');
    if(OG[id] === undefined){ OG[id] = null; getDoc(doc(col('order_gambar'), id)).then(s => { OG[id] = s.exists() ? s.data() : {}; $$(`[data-og^="${id}|"]`).forEach(x => { const g = OG[id][x.dataset.og.split('|')[1]]; if(g) x.src = g; }); }).catch(() => {}); }
    else if(OG[id]?.[jenis]) im.src = OG[id][jenis];
    im.onclick = () => { const g = OG[id] || {}, l = [g.plat, g.emblem, ...(g.calar||[])].filter(Boolean); if(!l.length) return toast('Tiada gambar'); const o = aktif.find(x => x.id === id) || bayarHari.find(x => x.id === id);
      bukaPaparan(l, {tajuk: `📸 ${o?.plat || 'Kenderaan'}`, nama: `Kenderaan-${(o?.plat || id).replace(/\s/g,'')}`, mula: jenis === 'emblem' ? 1 : 0}); };
  }
}
const ogThumb = o => o.gambar ? `<span class="ogt"><img data-og="${o.id}|plat" alt=""><img data-og="${o.id}|emblem" alt=""></span>` : '';
const tagAhli = o => `${o.ahli ? `<span class="tag gold">⭐ ${esc(o.ahli.kod)}</span>` : ''}${o.freeWash ? '<span class="tag ok">🎁 FREE WASH</span>' : ''}${o.mo ? `<span class="tag">MO: ${esc(o.mo.nama)}</span>` : ''}`;

      <span class="muted">${esc(t.nama)} · ${esc(t.kenderaan||'')} · ${esc(t.pakej)}${(t.addon||[]).length ? ' + ' + t.addon.map(a => esc(a.nama)).join(', ') : ''} · <b>${RM(t.jumlah)}</b><br>Datang: ${esc(t.masaDatang || 'sekarang')}${t.catatan ? ' · 📝 ' + esc(t.catatan) : ''}</span></div>
      <div class="row"><button class="btn-ok" data-tpterima="${t.id}">✅ Terima pesanan</button><button class="small btn-bad" data-tptolak="${t.id}">Tolak</button></div></div>`).join('')}
      <div class="muted" style="margin-top:6px">Bayaran boleh dibuat selepas pesanan diterima (masuk ke Queue).</div></div>` : '';
    if(!l.length) return htmlBayarPel() + tp + `<div class="card muted" style="text-align:center;padding:30px">${aktif.length ? 'Tiada plat sepadan.' : 'Tiada kenderaan dalam queue. 🎉'}</div>`;
    const bolehBayar = !['Pekerja','Sales'].includes(staf.peranan);
    return (bolehBayar ? htmlBayarPel() : '') + tp + l.map(o => {
      const i = STATUS.indexOf(o.status), seterus = STATUS[i+1];
      return `<div class="card qcard ${o.status==='Siap'?'siap':''}">
        <div class="between"><div style="display:flex;gap:8px;align-items:center">${ogThumb(o)}<div><span class="plate">${esc(o.plat)}</span> <span class="muted">${esc(o.no)}</span><br>${tagAhli(o)}</div></div><span class="tag ${o.status==='Siap'?'ok':'gold'}">${esc(o.status)} · ${minit(o.masaDibuat)} min</span></div>
        <div class="muted" style="margin-top:3px">${esc(o.pakej)}${(o.addon||[]).length?' + '+o.addon.map(a=>esc(a.nama)).join(', '):''} · ${esc(o.kenderaan)} · <b>${RM(o.jumlah)}</b></div>
        ${o.diskaunBeri ? `<div><span class="tag gold">🎟 Diskaun ${esc(labelDiskaun(o.diskaunBeri))}</span></div>` : o.diskaunMinta ? `<div><span class="tag">⏳ Minta diskaun RM${esc(o.diskaunMinta.amaun)}</span></div>` : ''}
        ${bayarPel.some(x => x.orderId === o.id) ? `<div><span class="tag ok">📲 Pelanggan dah bayar — semak di atas</span></div>` : ''}
        ${o.catatan?`<div class="muted">📝 ${esc(o.catatan)}</div>`:''}
        ${fotoK.some(f => f.orderId === o.id) ? `<div><span class="tag">📷 ${fotoK.filter(f => f.orderId === o.id).length} gambar keadaan</span></div>` : ''}
        <div class="steps">${STATUS.map((s,j) => `<span class="${j<=i?'done':''}"></span>`).join('')}</div>
        <div class="row">
          ${seterus ? `<button class="btn-dark" data-st="${o.id}|${seterus}">→ ${seterus}</button>` : ''}
          <select data-bay="${o.id}" style="width:auto;margin:0;padding:8px">${T.bay.map(b => `<option ${b===o.bay?'selected':''}>${esc(b)}</option>`).join('')}</select>
          ${i>0 ? `<button class="small" data-st="${o.id}|${STATUS[i-1]}">↩ ${STATUS[i-1]}</button>` : ''}
          ${bolehBayar ? `<button class="btn-ok" data-bayar="${o.id}">💳 Bayar</button>` : ''}
          ${bolehBayar ? `<button class="small btn-bad" data-batal="${o.id}">Batal</button>` : ''}
          ${PELULUS.includes(staf.peranan) ? `<button class="small" data-tukarmo="${o.id}">🧾 ${o.mo ? 'Tukar MO' : 'Set MO'}</button>` : ''}
          ${bolehBayar ? `<button class="small" data-edit="${o.id}">✏️ Edit</button>` : ''}
          ${bolehBayar ? `<button class="small" data-harga="${o.id}">💲 Betulkan harga</button>` : ''}
          <button class="small" data-fotok="${o.id}">📷 Gambar</button>
        </div></div>`;
    }).join('');
  },
  pasangLive(){
    $$('[data-st]').forEach(b => b.onclick = async () => {
      const [id, st] = b.dataset.st.split('|'); b.disabled = true;
      try{ await KT.tukarStatus(aktif.find(o => o.id === id) || {id}, cawangan, st); if(st === 'Siap') toast('✅ Siap — pelanggan dimaklumkan dalam Apps Pelanggan'); }catch(e){ onErr(e); }
    });
    $$('[data-bay]').forEach(s => s.onchange = () => updateDoc(doc(col('order'), s.dataset.bay), {bay:s.value}).catch(onErr));
    $$('[data-bayar]').forEach(b => b.onclick = () => bukaBayar(aktif.find(o => o.id === b.dataset.bayar))); pasangBayarPel();
    $$('[data-batal]').forEach(b => b.onclick = () => batalOrder(aktif.find(o => o.id === b.dataset.batal)));
    $$('[data-tukarmo]').forEach(b => b.onclick = () => tukarMO(aktif.find(o => o.id === b.dataset.tukarmo)));
    $$('[data-edit]').forEach(b => b.onclick = () => editOrder(aktif.find(o => o.id === b.dataset.edit)));
    $$('[data-harga]').forEach(b => b.onclick = () => betulHarga(aktif.find(o => o.id === b.dataset.harga)));
    $$('[data-fotok]').forEach(b => b.onclick = () => gambarKeadaan(aktif.find(o => o.id === b.dataset.fotok)));
    $$('[data-tpterima]').forEach(b => b.onclick = async () => { const t = tempahan.find(x => x.id === b.dataset.tpterima); if(!t) return; b.disabled = true;
      const h = today(), no = `${h.slice(5,7)}${h.slice(8,10)}-${pad(dibuatHari.length + 1, 3)}`;
      try{ await KT.terimaTempahan(t, cawangan, {no, bay: T.bay?.[0] || ''}); toast(`✅ Tempahan ${t.plat} diterima — masuk Queue`); }catch(e){ b.disabled = false; onErr(e); } });
    $$('[data-tptolak]').forEach(b => b.onclick = async () => { const t = tempahan.find(x => x.id === b.dataset.tptolak); const sebab = prompt('Sebab tolak tempahan (dimaklumkan kepada pelanggan):'); if(sebab === null) return;
      try{ await KT.tolakTempahan(t, cawangan, sebab); toast('Tempahan ditolak'); }catch(e){ onErr(e); } });
    muatGambarOrder();
  }
};



// 💲 Pembetulan harga setiap item dalam order (sebelum bayaran) — disahkan dengan PIN pekerja berkuasa
function betulHarga(o){
  if(!o) return;
  const baris = [
    {k:'pakej', nama: `${o.pakej}${o.freeWash ? ' (🎁 Free Wash)' : ''}`, h: +o.hargaPakej || 0, kunci: !!o.freeWash},
    ...(o.tambahanKenderaan ? [{k:'kend', nama: `Kenderaan: ${o.kenderaan}`, h: +o.tambahanKenderaan || 0}] : []),
    ...(o.addon || []).map((a, i) => ({k:'addon', i, nama: a.nama, h: +a.harga || 0})),
    ...(o.itemManual || []).map((a, i) => ({k:'manual', i, nama: a.nama, h: +a.harga || 0}))];
  openModal(`<div class="between"><h3 style="margin:0">💲 Betulkan harga — ${esc(o.plat)}</h3><button class="small" id="mTutup">✕</button></div>
    <div class="muted" style="margin:4px 0 8px">${esc(o.no || '')} · ${esc(o.kenderaan || '')}. Ubah harga item yang salah, isi sebab, kemudian sahkan dengan PIN.</div>
    ${baris.map((b, j) => `<div class="mrow"><span style="flex:1">${esc(b.nama)}<br><small class="muted">asal ${RM(b.h)}</small></span>
      <input type="number" inputmode="decimal" step="0.01" min="0" data-hb="${j}" value="${b.h}" ${b.kunci ? 'disabled title="Free Wash: harga pakej 0"' : ''} style="width:110px;margin:0;font-weight:800;text-align:right"></div>`).join('')}
    <div class="totalbar"><span>Jumlah baru</span><b id="hbJum"></b></div>
    ${o.diskaunBeri ? `<div class="muted">🎟 Diskaun ${esc(labelDiskaun(o.diskaunBeri))} kekal & ditolak semasa bayaran.</div>` : ''}
    <label>Sebab pembetulan *</label><input id="hbSebab" placeholder="cth: harga SUV tersilap pilih Sedan / harga promo kedai">
    <button class="btn-gold big" id="hbSimpan">🔐 SAHKAN DENGAN PIN & SIMPAN</button>`);
  $('#mTutup').onclick = closeModal;
  const nilai = () => baris.map((b, j) => b.kunci ? b.h : Math.max(0, r2(numVal(`[data-hb="${j}"]`))));
  const kira = () => { const v = nilai(), j = r2(v.reduce((t, x) => t + x, 0)); $('#hbJum').textContent = RM(j) + (j !== r2(o.jumlahKasar) ? ` (asal ${RM(o.jumlahKasar)})` : ''); return {v, j}; };
  $$('[data-hb]').forEach(i => i.oninput = kira); kira();
  $('#hbSimpan').onclick = async () => {
    const {v, j} = kira(), sebab = val('#hbSebab');
    const ubah = baris.map((b, k) => v[k] !== b.h ? `${b.nama} ${RM(b.h)}→${RM(v[k])}` : '').filter(Boolean);
    if(!ubah.length) return toast('Tiada harga diubah');
    if(!sebab) return toast('Sila isi sebab pembetulan');
    const pelulus = await mintaPinHarga(`${o.plat}: ${ubah.join(', ')} · Jumlah ${RM(o.jumlahKasar)} → ${RM(j)}`); if(!pelulus) return;
    const data = {addon: (o.addon || []).map(a => ({...a})), itemManual: (o.itemManual || []).map(a => ({...a}))};
    baris.forEach((b, k) => { const h = v[k];
      if(b.k === 'pakej') data.hargaPakej = h; else if(b.k === 'kend') data.tambahanKenderaan = h;
      else if(b.k === 'addon') data.addon[b.i].harga = h; else if(b.k === 'manual') data.itemManual[b.i].harga = h; });
    Object.assign(data, {jumlahKasar: j, jumlah: j, dikemaskiniOleh: staf.nama,
      sejarahHarga: arrayUnion({asal: r2(o.jumlahKasar), baru: j, ubah: ubah.join(', '), sebab, oleh: staf.nama, lulusOleh: pelulus.nama, masa: Date.now()}),
      sejarahEdit: arrayUnion({oleh: staf.nama, masa: Date.now(), ubah: `harga: ${ubah.join(', ')} (PIN ${pelulus.nama}) — ${sebab}`})});
    $('#hbSimpan').disabled = true;
    try{ await updateDoc(doc(col('order'), o.id), data); KT.cermin({...o, ...data, sejarahHarga: undefined, sejarahEdit: undefined}, cawangan);
      closeModal(); toast(`✅ Harga ${o.plat} dibetulkan: ${RM(j)} (disahkan ${pelulus.nama})`); }
    catch(e){ $('#hbSimpan').disabled = false; onErr(e); }
  };
}

// ✏️ Edit order dalam queue: betulkan plat, jenis kenderaan, pakej, add-on & catatan (harga dikira semula)
function editOrder(o){
  if(!o) return;
  const L = {pakej: aktifSahaja('pakej'), kenderaan: aktifSahaja('kenderaan'), addon: aktifSahaja('addon')};
  if(!L.kenderaan.length) L.kenderaan = [{id:'k0', nama:'Kereta', harga:0}];
  let ki = Math.max(0, L.kenderaan.findIndex(k => k.nama === o.kenderaan)), pi = L.pakej.findIndex(p => p.id === o.pakejId);
  const pilihAddon = new Set((o.addon || []).map(a => L.addon.findIndex(x => x.id === a.id)).filter(i => i >= 0));
  const addonLama = (o.addon || []).filter(a => !L.addon.some(x => x.id === a.id));   // add-on yang tiada lagi dalam tetapan: dikekalkan
  const fw = !!o.freeWash, manual = (o.itemManual || []).map(a => ({...a}));
  openModal(`<div class="between"><h3 style="margin:0">✏️ Edit order ${esc(o.no || '')}</h3><button class="small" id="mTutup">✕</button></div>
    <label>No. plat</label><input id="eP" value="${esc(o.plat)}" autocapitalize="characters" style="text-transform:uppercase;font-size:20px;font-weight:800">
    <label>Jenis kenderaan</label><div class="choices" id="eK">${L.kenderaan.map((k,i) => `<button class="choice ${i===ki?'sel':''}" data-i="${i}"><b>${esc(k.nama)}</b></button>`).join('')}</div>
    <label>Pakej${fw ? ' (🎁 Free Wash — pakej dikunci)' : ''}</label><div class="choices" id="eJ">${L.pakej.map((p,i) => `<button class="choice ${i===pi?'sel':''}" data-i="${i}" ${fw && i !== pi ? 'disabled style="opacity:.4"' : ''}><b>${esc(p.nama)}</b><span data-ehp="${i}"></span></button>`).join('')}</div>
    <label>Add-on</label><div class="choices" id="eA">${L.addon.map((a,i) => `<button class="choice ${pilihAddon.has(i)?'sel':''}" data-i="${i}"><b>${esc(a.nama)}</b><span data-eha="${i}"></span></button>`).join('')}</div>
    ${addonLama.length ? `<div class="muted">Dikekalkan: ${addonLama.map(a => esc(a.nama) + ' ' + RM(a.harga)).join(', ')}</div>` : ''}
    <label>➕ Item / harga tambahan manual (di luar pakej / cucian spot)</label><div id="eManual"></div>
    <div class="row" style="flex-wrap:nowrap;gap:6px"><input id="eMNama" placeholder="cth: Buang tar pintu kiri" style="margin:0;flex:1"><input id="eMHarga" type="number" inputmode="decimal" step="0.01" placeholder="RM" style="margin:0;width:90px"><button class="small" id="eMTambah">+ Tambah</button></div>
    <label>Catatan / remarks</label><textarea id="eC" rows="2" placeholder="cth: calar pintu kiri, pelanggan minta fokus sport rim">${esc(o.catatan || '')}</textarea>
    <div class="totalbar"><span>Jumlah baru</span><b id="eJum"></b></div>
    ${o.diskaunBeri ? `<div class="muted">🎟 Diskaun ${esc(labelDiskaun(o.diskaunBeri))} kekal & ditolak semasa bayaran.</div>` : ''}
    <button class="btn-gold big" id="eSimpan">SIMPAN PERUBAHAN</button>`);
  $('#mTutup').onclick = closeModal;
  const kira = () => {
    const k = L.kenderaan[ki];
    L.pakej.forEach((x,i) => { const h = hargaPakejK(x, k), e = $(`[data-ehp="${i}"]`); if(e) e.textContent = h == null ? 'ikut permintaan' : RM(h); });
    L.addon.forEach((x,i) => { const h = hargaAddonK(x, k), e = $(`[data-eha="${i}"]`); if(e) e.textContent = h == null ? 'tiada' : '+' + RM(h); });
    const p = L.pakej[pi], hp = p ? hargaPakejK(p, k) : null;
    const addon = [...[...pilihAddon].map(i => ({id: L.addon[i].id, nama: L.addon[i].nama, harga: hargaAddonK(L.addon[i], k) ?? 0})), ...addonLama];
    const kasar = r2((fw ? 0 : (hp ?? 0)) + sum(addon, a => a.harga) + sum(manual, a => a.harga));
    $('#eJum').textContent = hp == null && p ? 'Harga pakej ikut permintaan' : RM(kasar) + (kasar !== o.jumlahKasar ? ` (asal ${RM(o.jumlahKasar)})` : '');
    return {k, p, hp, addon, kasar};
  };
  const pilih = (box, fn) => $$(`${box} .choice`).forEach(b => b.onclick = () => { if(b.disabled) return; fn(+b.dataset.i, b); kira(); });
  pilih('#eK', i => { ki = i; $$('#eK .choice').forEach((x,j) => x.classList.toggle('sel', j === i)); });
  pilih('#eJ', i => { pi = i; $$('#eJ .choice').forEach((x,j) => x.classList.toggle('sel', j === i)); });
  pilih('#eA', (i, b) => { pilihAddon.has(i) ? pilihAddon.delete(i) : pilihAddon.add(i); b.classList.toggle('sel'); });
  const lukisM = () => { $('#eManual').innerHTML = manual.map((a, i) => `<div class="mrow"><span>${esc(a.nama)}</span><span><b>${RM(a.harga)}</b> <button class="small btn-bad" data-emb="${i}">✕</button></span></div>`).join('');
    $$('[data-emb]').forEach(b => b.onclick = () => { manual.splice(+b.dataset.emb, 1); lukisM(); kira(); }); };
  $('#eMTambah').onclick = () => { const n = val('#eMNama'), h = r2(numVal('#eMHarga')); if(!n) return toast('Isi nama item'); if(!(h > 0)) return toast('Isi harga');
    manual.push({nama: n, harga: h}); $('#eMNama').value = ''; $('#eMHarga').value = ''; lukisM(); kira(); };
  lukisM(); kira();
  $('#eSimpan').onclick = async () => {
    const plat = paparPlat(val('#eP')), {k, p, hp, addon, kasar} = kira();
    if(!normPlat(plat)) return toast('No. plat kosong');
    if(!p) return toast('Pilih pakej');
    if(hp == null) return toast(`${p.nama}: harga ikut permintaan bagi ${k.nama} — guna item manual semasa bayaran`);
    const ubah = [];
    if(normPlat(plat) !== normPlat(o.plat)) ubah.push(`plat ${o.plat}→${plat}`);
    if(k.nama !== o.kenderaan) ubah.push(`kenderaan ${o.kenderaan}→${k.nama}`);
    if(p.id !== o.pakejId) ubah.push(`pakej ${o.pakej}→${p.nama}`);
    const aLama = (o.addon || []).map(a => a.id).sort().join(), aBaru = addon.map(a => a.id).sort().join(); if(aLama !== aBaru) ubah.push('add-on');
    if(val('#eC') !== (o.catatan || '')) ubah.push('catatan');
    if(JSON.stringify(manual) !== JSON.stringify(o.itemManual || [])) ubah.push('item manual');
    if(val('#eMNama') && !confirm('Item manual belum ditambah (tekan "+ Tambah"). Teruskan tanpa item itu?')) return;
    if(!ubah.length) return closeModal();
    const komisen = o.mo ? r2((fw ? 0 : Number(KOMISEN[p.id]) || 0) + sum(addon, a => Number(KOMISEN[a.id]) || 0)) : (o.komisen || 0);
    const data = {plat, kenderaan: k.nama, pakejId: p.id, pakej: p.nama, hargaPakej: fw ? 0 : p.harga, tambahanKenderaan: fw ? 0 : r2(hp - p.harga), addon, itemManual: manual,
      jumlahKasar: kasar, jumlah: kasar, catatan: val('#eC'), komisen, ...(fw ? {freeWash: {...o.freeWash, nilai: r2(hp)}} : {}),
      sejarahEdit: arrayUnion({oleh: staf.nama, masa: Date.now(), ubah: ubah.join(', ')}), dikemaskiniOleh: staf.nama};
    $('#eSimpan').disabled = true;
    try{
      await updateDoc(doc(col('order'), o.id), data);
      if(normPlat(plat) !== normPlat(o.plat)){
        deleteDoc(doc(col('bayar_awam'), normPlat(o.plat))).catch(() => {});
        if(o.ahli?.id){ updateDoc(doc(ahliCol(), o.ahli.id), {plat: arrayUnion(normPlat(plat)), kenderaan: arrayUnion({plat, jenis: k.nama})}).catch(console.error);
          if(o.telefon) setDoc(doc(store, 'ahli_masuk', kunciMasuk(o.telefon, plat)), {token: o.ahli.id}).catch(console.error); }
      }
      KT.cermin({...o, ...data, sejarahEdit: undefined}, cawangan);
      closeModal(); toast(`✅ ${plat} dikemas kini: ${ubah.join(', ')}`);
    }catch(e){ $('#eSimpan').disabled = false; onErr(e); }
  };
}
// 📷 Gambar keadaan asal kenderaan (dalam, calar, kondisi) — bukti sebelum servis
function gambarKeadaan(o){
  if(!o) return;
  const lukis = () => { const l = fotoK.filter(f => f.orderId === o.id);
    $('#gkSenarai').innerHTML = l.length ? l.map(f => `<figure style="margin:0;text-align:center"><img src="${f.gambar}" data-gkbesar="${f.id}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer"><figcaption class="muted" style="font-size:12px">${esc(f.nota || '')}${f.nota ? ' · ' : ''}${esc(f.oleh || '')} ${fMasa(f.masa)}</figcaption></figure>`).join('') : '<p class="muted">Belum ada gambar keadaan.</p>';
    $$('[data-gkbesar]').forEach((im, j) => im.onclick = () => bukaPaparan(l.map(f => ({src: f.gambar, nota: f.nota})), {tajuk: `Keadaan ${o.plat}`, nama: `Keadaan-${o.plat.replace(/\s/g,'')}`, mula: j})); };
  openModal(`<div class="between"><h3 style="margin:0">📷 Keadaan asal — ${esc(o.plat)}</h3><button class="small" id="mTutup">✕</button></div>
    <p class="muted" style="margin-top:4px">Ambil gambar bahagian dalam, calar, kemik atau barang berharga sebagai bukti keadaan asal sebelum servis.</p>
    <div id="gkSenarai" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
    <label>Nota gambar (pilihan)</label><input id="gkNota" placeholder="cth: tempat duduk belakang kotor, calar bumper">
    <label class="btn-gold big" style="display:block;text-align:center;cursor:pointer;margin-top:8px">📸 AMBIL / PILIH GAMBAR<input id="gkFail" type="file" accept="image/*" capture="environment" multiple style="display:none"></label>`);
  $('#mTutup').onclick = closeModal; lukis();
  $('#gkFail').onchange = async e => { const fail = [...e.target.files]; e.target.value = ''; if(!fail.length) return;
    for(const f of fail){ try{ const g = await kecilkanGambar(f, 900, 0.6);
      const d = {orderId: o.id, plat: o.plat, gambar: g, nota: val('#gkNota'), oleh: staf.nama, masa: Date.now(), tarikh: today()};
      const ref = doc(col('foto_keadaan')); await setDoc(ref, d); if(!fotoK.some(x => x.id === ref.id)) fotoK.push({id: ref.id, ...d}); }catch(err){ onErr(err); } }
    $('#gkNota').value = ''; lukis(); toast('📷 Gambar keadaan disimpan'); };
}

// Supervisor / Manager / Admin: betulkan MO yang dapat komisen (jika pertikaian). Direkod dalam moLog.
function tukarMO(o){
  if(!o) return;
  const calon = stafList.filter(x => x.aktif !== false && (x.mo || x.peranan === 'Sales'));

// ---------- SAFARI MEMBERS: cop & Free Wash ----------
async function beriCop(o){
  if(!o?.ahli || o.freeWash) return '';
  const ref = doc(ahliCol(), o.ahli.id);
  try{
    const hasil = await runTransaction(store, async tx => {
      const s = await tx.get(ref); if(!s.exists()) throw new Error('Ahli tidak dijumpai');
      const r = tambahCop(s.data(), {orderId: o.id, plat: o.plat, cawangan, tarikh: o.tarikhBayar || today(), pakejId: o.pakejId || ''});
      if(!r.ok) return {ok:false, sebab: r.sebab};
      tx.update(ref, r.data);
      return {ok:true, bil: r.data.cop.length, dapat: r.dapatFreeWash, selesai: r.data.cop.length === 0, aktif: r.diaktifkan};
    });
    let info;
    if(!hasil.ok) info = `Tiada cop: ${hasil.sebab}`;
    else info = hasil.dapat ? `⭐ Cop diberi — 🎁 DAPAT 1 FREE WASH!${hasil.selesai ? ' (kad penuh, bermula semula)' : ''}` : `⭐ Cop ${hasil.bil}/${KAD.saiz} diberi${hasil.aktif ? ' — kad loyalti kini AKTIF' : ''}`;
    await updateDoc(doc(col('order'), o.id), {copInfo: info, copGagal: false, cop: !!hasil.ok});
    if(hasil.ok) setDoc(doc(collection(store, 'ahli', o.ahli.id, 'sejarah'), o.id), {tarikh: o.tarikhBayar || today(), cawangan, plat: o.plat, pakej: o.pakej, jumlah: o.jumlah, cop: true, masa: Date.now()}).catch(console.error);
    return info;
  }catch(e){
    console.error(e);
    updateDoc(doc(col('order'), o.id), {copGagal: true}).catch(() => {});
    return '⚠ Cop gagal diberi (tiada internet?) — tekan "cuba lagi" di tab Bayaran';
  }
}
async function tebusFreeWash(o, oleh){
  const ref = doc(ahliCol(), o.ahli.id);
  return runTransaction(store, async tx => {
    const s = await tx.get(ref); if(!s.exists()) throw new Error('Ahli tidak dijumpai');
    const r = gunaFreeWash(s.data(), o.freeWash.fwId, {orderId: o.id, cawangan, oleh});
    if(!r.ok) throw new Error(r.sebab);
    tx.update(ref, r.data);
  });
}
async function batalSafari(o){
  if(!o?.ahli) return;
  const ref = doc(ahliCol(), o.ahli.id);
  try{
    await runTransaction(store, async tx => {
      const s = await tx.get(ref); if(!s.exists()) return;
      const a = s.data();
      if(o.freeWash && o.tarikhBayar) tx.update(ref, pulangFreeWash(a, o.id));
      else if(o.cop){ const d = batalCop(a, o.id); if(d) tx.update(ref, d); }
    });
    deleteDoc(doc(collection(store, 'ahli', o.ahli.id, 'sejarah'), o.id)).catch(() => {});
  }catch(e){ console.error(e); toast('⚠ Cop / Free Wash ahli tidak dapat dikemas kini: ' + e.message); }
}

async function kecilkanGambar(fail, maks=900, kualiti=0.6){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(fail); });
  const s = Math.min(1, maks / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', kualiti);
}

    <button class="btn-gold big" id="iSimpan">SIMPAN</button>
    ${s?'<button class="btn-bad big" id="iPadam" style="margin-top:8px">Padam item</button>':''}`);
  $('#mTutup').onclick = closeModal;

  };
  if($('#iPadam')) $('#iPadam').onclick = async () => { if(!confirm(`Padam ${s.nama}?`)) return; try{ await deleteDoc(doc(col('stok'), s.id)); closeModal(); }catch(e){ onErr(e); } };
}
function gerakStok(s, jenis){
  const tajuk = {Masuk:'➕ Terima stok', Guna:'➖ Guna / keluarkan stok', Laras:'⚖ Laras kiraan stok'}[jenis];
  openModal(`<div class="between"><h3 style="margin:0">${tajuk}</h3><button class="small" id="mTutup">✕</button></div>
    <p><b>${esc(s.nama)}</b> — baki sekarang <b>${s.baki} ${esc(s.unit)}</b></p>
    <label>${jenis==='Laras'?'Kiraan sebenar ('+esc(s.unit)+')':'Kuantiti ('+esc(s.unit)+')'}</label><input id="gQty" type="number" inputmode="decimal" step="0.1">
    <label>Catatan</label><input id="gCat" placeholder="${jenis==='Masuk'?'cth: dari Kedai ABC':'cth: Bay 2'}">
    <button class="btn-gold big" id="gSimpan">SIMPAN</button>`);
  $('#mTutup').onclick = closeModal;
  $('#gSimpan').onclick = async () => {
    const q = numVal('#gQty');
    if(jenis !== 'Laras' && !(q > 0)) return toast('Sila isi kuantiti');
    if(jenis === 'Laras' && q < 0) return toast('Kiraan tidak sah');
    let delta = jenis === 'Masuk' ? q : jenis === 'Guna' ? -q : r2(q - (s.baki||0));
    let lulus = '';
    if(jenis === 'Laras'){ lulus = await perluLulus(`Laras stok ${s.nama}: ${s.baki} → ${q}`); if(!lulus) return; }
    if(jenis === 'Guna' && q > (s.baki||0) && !confirm('Kuantiti melebihi baki. Teruskan?')) return;
    const t = today();
    try{
      await updateDoc(doc(col('stok'), s.id), {baki: increment(delta)});
      await addDoc(col('stok_log'), {item:s.id, nama:s.nama, jenis, kuantiti:delta, catatan: val('#gCat'), oleh: staf.nama, lulus, tarikh:t, masa:Date.now()});
      closeModal(); toast('✅ Stok dikemas kini');
    }catch(e){ onErr(e); }
  };
}

function jadualMO(sah){
  const g = {}; sah.filter(o => o.mo).forEach(o => { const k = `${o.mo.idStaf ? o.mo.idStaf + ' ' : ''}${o.mo.nama}`; g[k] ||= {n:0, rm:0, kom:0}; g[k].n++; g[k].rm += o.jumlah; g[k].kom += Number(o.komisen)||0; });
  const e = Object.entries(g).sort((a,b) => b[1].kom - a[1].kom);
  return e.length ? `<table><tr><th>MO</th><th class="r">Order</th><th class="r">Jualan</th><th class="r">Komisen</th></tr>${e.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r">${RM(v.rm)}</td><td class="r"><b>${RM(v.kom)}</b></td></tr>`).join('')}</table>` : '<p class="muted">Tiada order oleh MO.</p>';
}
function jadual(obj, lajur='Bil'){

function lapBulanan(){

  const max = Math.max(1, ...perHari.map(h => h.rm)), aktifH = perHari.filter(h => h.n);

function csvBulanan(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const kol = ['tarikhBayar','no','plat','nama','telefon','ahliKod','kenderaan','pakej','addon','freeWash','jumlahKasar','diskaun','jumlah','kaedah','rujukan','status','dibuatOleh','mo','komisen','dibayarOleh'];
  const rows = [...lData.bayar].sort((a,b) => (a.masaBayar||0)-(b.masaBayar||0)).map(o => ({...o, telefon: paparTelefon(o.telefon), ahliKod: o.ahli?.kod || '', freeWash: o.freeWash ? 'Ya' : '', mo: o.mo ? `${o.mo.idStaf} ${o.mo.nama}` : '', addon:(o.addon||[]).map(a=>a.nama).join(' + '), kaedah:o.bayar?.kaedah, rujukan:o.bayar?.rujukan}));
  const csv = '﻿' + kol.join(',') + '\n' + rows.map(r => kol.map(k => q(r[k])).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = `lion-safari-jualan-${lBulan}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- STAF ----------
const awalanId = () => cawangan === 'lion-king' ? 'LK' : 'ML';
function idSeterus(){
  const a = awalanId(), n = Math.max(0, ...stafList.map(x => { const m = String(x.idStaf||'').match(new RegExp('^' + a + '-?(\\d+)$', 'i')); return m ? +m[1] : 0; }));
  return `${a}${pad(n + 1, 3)}`;
}
// Admin urus semua; Manager urus Supervisor/Cashier/Pekerja sahaja
const bolehUrus = x => staf.peranan === 'Admin' || (staf.peranan === 'Manager' && tahap(x?.peranan || 'Pekerja') < tahap('Manager'));
const perananBoleh = () => Object.keys(PERANAN).filter(r => staf.peranan === 'Admin' || tahap(r) < tahap('Manager'));
VIEWS['Staf'] = {
  statik: () => `<div class="between" style="margin-bottom:10px"><h3 style="margin:0">👥 Staf, ID & Peranan</h3><button class="btn-dark" id="btnStaf">+ Staf baru</button></div>
    <div class="notice">${Object.entries(KETERANGAN_PERANAN).map(([r,k]) => `<b>${r}</b> — ${k}`).join('<br>')}</div>`,
  pasang(){ $('#btnStaf').onclick = () => borangStaf(); },
  live: () => `<div class="card"><table><tr><th></th><th>ID</th><th>Nama / Peranan</th><th>Status</th><th></th></tr>${stafList.map(s => `<tr><td style="width:44px">${av(s, 38)}</td><td><b>${esc(s.idStaf||'—')}</b></td><td><b>${esc(s.nama)}</b>${s.id===staf.id?' <span class="tag gold">anda</span>':''}<br><span class="muted">${esc(s.peranan)}</span></td>
      <td>${s.aktif===false?'<span class="tag bad">Tidak aktif</span>':'<span class="tag ok">Aktif</span>'}</td><td class="r">${bolehUrus(s) || s.id===staf.id ? `<button class="small" data-staf="${s.id}">Urus</button>` : ''}</td></tr>`).join('')}</table></div>`,
  pasangLive(){ $$('[data-staf]').forEach(b => b.onclick = () => borangStaf(stafList.find(s => s.id === b.dataset.staf))); }
};
function borangStaf(s){
  const diri = s && s.id === staf.id && !bolehUrus(s);   // Manager urus diri sendiri: tukar PIN sahaja
  const pilihan = diri ? [s.peranan] : perananBoleh();
  let fotoBaru;   // undefined = tidak berubah, '' = buang, data URL = baru
  openModal(`<div class="between"><h3 style="margin:0">${s?'Urus staf':'Staf baru'}</h3><button class="small" id="mTutup">✕</button></div>
    <label>Gambar profil (dipapar pada ID staf)</label>
    <div class="foto-edit"><span id="fFotoPrev"></span><div class="row">
      <label class="foto-btn">📷 Ambil gambar<input id="fFotoKam" type="file" accept="image/*" capture="user" style="display:none"></label>
      <label class="foto-btn" style="background:#475569">🖼 Galeri<input id="fFotoGal" type="file" accept="image/*" style="display:none"></label>
      <button class="small btn-bad" id="fFotoBuang">Buang</button></div></div>
    <div class="two"><div><label>ID Staf</label><input id="fId" value="${esc(s?.idStaf || idSeterus())}" autocapitalize="characters" style="text-transform:uppercase" ${diri?'disabled':''}></div>
    <div><label>Peranan</label><select id="fPeranan" ${diri?'disabled':''}>${pilihan.map(p => `<option ${p===(s?.peranan||'Cashier')?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <label>Nama</label><input id="fNama" value="${esc(s?.nama||'')}" ${diri?'disabled':''}>
    <label>${s?'PIN baru (biar kosong jika tidak tukar)':'PIN (4–6 digit)'}</label><input id="fPin" type="password" inputmode="numeric" maxlength="6">
    ${s && !diri ?`<label class="row" style="font-weight:400;margin-bottom:10px"><input type="checkbox" id="fAktif" ${s.aktif!==false?'checked':''} style="width:22px;height:22px;margin:0"> Aktif (boleh log masuk)</label>`:''}
    <button class="btn-gold big" id="fSimpan">SIMPAN</button>`);
  $('#mTutup').onclick = closeModal;
  const prevFoto = () => { const f = fotoBaru !== undefined ? fotoBaru : (s ? FOTO[s.id] : ''); $('#fFotoPrev').innerHTML = avatar(f, val('#fNama') || s?.nama || '?', 84); $('#fFotoBuang').classList.toggle('hidden', !f); };
  prevFoto();
  const ambilFoto = async e => { const f = e.target.files[0]; if(!f) return; try{ fotoBaru = await fotoProfil(f); prevFoto(); }catch(_){ toast('Gagal membaca gambar'); } e.target.value = ''; };
  $('#fFotoKam').onchange = ambilFoto; $('#fFotoGal').onchange = ambilFoto;
  $('#fFotoBuang').onclick = () => { fotoBaru = ''; prevFoto(); };
  $('#fNama').oninput = () => { if(!(fotoBaru || (s && FOTO[s.id]))) prevFoto(); };
  const simpanFoto = async id => {
    if(fotoBaru) await setDoc(doc(stafCol('staf_foto'), id), {data: fotoBaru, oleh: staf.nama, dikemaskini: serverTimestamp()});
    else if(fotoBaru === '') await deleteDoc(doc(stafCol('staf_foto'), id));
  };
  $('#fSimpan').onclick = async () => {
    const pin = val('#fPin');
    if((!s || pin) && !/^\d{4,6}$/.test(pin)) return toast('PIN mesti 4–6 digit');
    const ref = s ? doc(stafCol('staf'), s.id) : doc(stafCol('staf'));
    try{
      if(diri){ if(pin) await updateDoc(ref, {pinHash: await hashPin(ref.id, pin)}); await simpanFoto(ref.id); closeModal(); return toast(pin ? '✅ PIN ditukar' : fotoBaru !== undefined ? '✅ Gambar profil dikemas kini' : 'Tiada perubahan'); }
      const nama = val('#fNama'), peranan = val('#fPeranan'), idStaf = val('#fId').toUpperCase().replace(/\s+/g,''), aktifF = s ? $('#fAktif').checked : true;
      if(!nama) return toast('Sila isi nama');
      if(!idStaf) return toast('Sila isi ID staf');
      if(stafList.some(x => x.id !== s?.id && String(x.idStaf||'').toUpperCase() === idStaf)) return toast(`ID ${idStaf} sudah digunakan`);
      if(!perananBoleh().includes(peranan)) return toast('Anda tiada kuasa memberi peranan ini');
      const adminLain = stafList.filter(x => x.peranan === 'Admin' && x.aktif !== false && x.id !== s?.id).length;
      if(s && s.peranan === 'Admin' && (peranan !== 'Admin' || !aktifF) && !adminLain) return toast('Mesti ada sekurang-kurangnya seorang Admin aktif');
      const d = {nama, idStaf, peranan, aktif: aktifF};
      if(pin) d.pinHash = await hashPin(ref.id, pin);
      if(s) await updateDoc(ref, d); else await setDoc(ref, {...d, dicipta: serverTimestamp()});
      await simpanFoto(ref.id);
      closeModal(); toast('✅ Staf disimpan');
    }catch(e){ onErr(e); }
  };
}

// ---------- PEKERJA (kehadiran, kelulusan advance/claim/OT, roster) ----------
const modulPK_bolehLulus = m => !!staf && MOHON_BUKAN_WANG.includes(m.jenis) && (m.jenis === 'tukar' ? adaKuasa(staf,'roster') : adaKuasa(staf,'lulus'));
VIEWS['Pekerja'] = {
  live: () => { const m = modPK(staf); if(!m.includes(pkMod)) pkMod = m[0]; return modulPK.html(pkMod, m) + (pkMod === 'Permohonan' ? '<p class="muted" style="text-align:center">Advance & claim diluluskan oleh Dato\' / Datin di apps Akaun.</p>' : ''); },
  pasangLive: () => modulPK.pasang(m => { pkMod = m; refreshLive(); })
};

// ---------- TETAPAN ----------
VIEWS['Tetapan'] = {
  statik: () => !bolehTetapan(staf) ? '<div class="notice bad">⛔ Tiada kuasa Tetapan.</div>' : `<div class="card"><h3>⚙️ Tetapan — ${esc(infoCaw().nama)}</h3>
      <div class="muted">Perubahan pakej, servis & harga di bawah disimpan <b>serta-merta</b> dan terus dipakai di semua peranti kaunter cawangan ini. Harga order yang sudah dibuat tidak berubah.</div></div>
    <div id="live"></div>
    <div class="card"><h3>🏪 Maklumat kedai (untuk resit)</h3>
      <label>Nama kedai</label><input id="tNama" value="${esc(T.namaKedai)}">
      <label>Alamat</label><input id="tAlamat" value="${esc(T.alamat)}">
      <label>Telefon</label><input id="tTel" value="${esc(T.telefon)}">
      <label>Nota bawah resit</label><input id="tNota" value="${esc(T.notaResit)}">
      <label>Nota bawah resit (English)</label><input id="tNotaEN" value="${esc(T.notaResitEN || '')}" placeholder="cth: Thank you! See you again 🦁"></div>
    <div class="card"><h3>⭐ Safari Members & Apps Pelanggan</h3>
      <label>Pakej untuk Free Wash (Basic)</label><select id="tFW">${aktifSahaja('pakej').map(p => `<option value="${p.id}" ${p.id===(T.pakejFreeWash||aktifSahaja('pakej')[0]?.id)?'selected':''}>${esc(p.nama)} — ${RM(p.harga)}</option>`).join('')}</select>
      <div class="muted" style="margin:-6px 0 8px">Kad: ${KAD.saiz} cop · cop ke-${KAD.ganjaranPada[0]} & ke-${KAD.saiz} = 1 Free Wash · cop & Free Wash luput 12 bulan. (Tetapan di Apps Akaun)</div>
      <label>No. WhatsApp kedai (untuk pelanggan)</label><input id="tWa" type="tel" value="${esc(T.whatsapp||'')}" placeholder="cth 0123456789">
      <label>Waktu operasi</label><input id="tWaktu" value="${esc(T.waktuOperasi||'')}" placeholder="cth Setiap hari 9:00 pagi – 12:00 malam">
      <label>Pautan Google Maps</label><input id="tMaps" value="${esc(T.mapsUrl||'')}" placeholder="https://maps.app.goo.gl/..."></div>
    <div class="card"><h3>🅿️ Bay & kategori</h3>
      <label>Bay cucian (satu setiap baris)</label><textarea id="tBay" rows="3">${esc(T.bay.join('\n'))}</textarea>
      <label>Kategori petty cash (satu setiap baris)</label><textarea id="tKatPetty" rows="5">${esc((T.katPetty?.length ? T.katPetty : KAT_PETTY).join('\n'))}</textarea></div>
    <div class="card"><h3>🔐 Kawalan & kelulusan</h3><div class="two">
      <div><label>Float tunai laci (RM)</label><input id="tFloat" type="number" inputmode="decimal" value="${T.floatTunai}"></div>
      <div><label>Had belanja petty cash tanpa kelulusan (RM)</label><input id="tPetty" type="number" inputmode="decimal" value="${T.hadPetty}"></div>
      <div><label>Had diskaun tanpa kelulusan (RM)</label><input id="tDis" type="number" inputmode="decimal" value="${T.hadDiskaun}"></div></div>
      <div class="muted">0 = setiap diskaun perlu PIN Supervisor / Manager / Admin.</div></div>
    <button class="btn-gold big" id="tSimpan">SIMPAN MAKLUMAT KEDAI, BAY & KAWALAN</button>
    <div class="card" style="margin-top:12px"><h3>📱 Peranti ini</h3><div class="muted">Log masuk sebagai ${esc(dev?.email||'')} · Cawangan: <b>${esc(infoCaw().nama)}</b></div>
      <div class="row" style="margin-top:8px"><button id="tTukarCaw">🏪 Tukar cawangan peranti</button><button class="btn-bad" id="tDevOut">Log keluar peranti</button></div></div>`,
  pasang(){
    if(!bolehTetapan(staf)) return;
    $('#tSimpan').onclick = async () => {
      const d = {namaKedai: val('#tNama') || infoCaw().kedai, alamat: val('#tAlamat'), telefon: val('#tTel'), notaResit: val('#tNota'), notaResitEN: val('#tNotaEN'),
        bay: $('#tBay').value.split('\n').map(s => s.trim()).filter(Boolean),
        katPetty: $('#tKatPetty').value.split('\n').map(s => s.trim()).filter(Boolean),
        floatTunai: numVal('#tFloat'), hadPetty: numVal('#tPetty'), hadDiskaun: numVal('#tDis'), dikemaskiniOleh: staf.nama,
        pakejFreeWash: val('#tFW'), whatsapp: val('#tWa'), waktuOperasi: val('#tWaktu'), mapsUrl: val('#tMaps')};
      if(!d.bay.length) d.bay = ['Bay 1'];
      if(!d.katPetty.length) d.katPetty = [...KAT_PETTY];
      try{ await setDoc(tetapanRef(), d, {merge:true}); toast('✅ Tetapan disimpan'); }catch(e){ onErr(e); }
    };
    $('#tTukarCaw').onclick = () => { closeModal(); kunci(); renderPilihCawangan(true); };
    $('#tDevOut').onclick = () => { if(confirm('Log keluar peranti ini?')) { try{ localStorage.removeItem('ls_staf'); }catch(_){} signOut(auth); } };
  },
  // Senarai pakej / servis / kenderaan dikemas kini secara langsung
  live: () => !bolehTetapan(staf) ? '' : Object.entries(JENIS_ITEM).map(([j, J]) => {
    const l = senarai(j);
    return `<div class="card"><div class="between"><h3 style="margin:0">${J.ikon} ${J.label}</h3><button class="btn-dark small" data-tambah="${j}">+ Tambah</button></div>
      ${j==='kenderaan' ? '<div class="muted" style="margin-top:4px">Harga di sini ialah <b>tambahan</b> kepada harga pakej (boleh negatif, cth motosikal −5).</div>' : ''}
      <div style="margin-top:6px">${l.map((x,i) => `<div class="item ${x.aktif?'':'off'}">
        ${J.gambar ? imgItem(x,'th',J.ikon) : ''}
        <div class="nm"><b>${esc(x.nama)}</b><small>${j==='kenderaan' ? (x.harga ? (x.harga>0?'+':'')+RM(x.harga) : 'harga asas') : (j==='addon'?'+':'')+RM(x.harga)}${x.minit?` · ~${x.minit} min`:''}${x.aktif?'':' · <b>tidak aktif</b>'}</small>${x.ket?`<small style="display:block">${esc(x.ket)}</small>`:''}</div>
        <div class="bt"><button class="small" data-gerak="${j}|${i}|-1" ${i===0?'disabled':''}>▲</button><button class="small" data-gerak="${j}|${i}|1" ${i===l.length-1?'disabled':''}>▼</button><button class="small" data-ubah="${j}|${x.id}">✏️ Ubah</button></div>
      </div>`).join('') || '<p class="muted">Tiada lagi.</p>'}</div></div>`;
  }).join(''),
  pasangLive(){
    if(!bolehTetapan(staf)) return;
    $$('[data-tambah]').forEach(b => b.onclick = () => borangMenu(b.dataset.tambah, null));
    $$('[data-ubah]').forEach(b => b.onclick = () => { const [j, id] = b.dataset.ubah.split('|'); borangMenu(j, id); });
    $$('[data-gerak]').forEach(b => b.onclick = async () => {
      const [j, i, d] = b.dataset.gerak.split('|'); const l = senarai(j), a = +i, c = a + +d;
      if(c < 0 || c >= l.length) return;
      [l[a], l[c]] = [l[c], l[a]];
      await simpanSenarai(j, l);
    });
  }
};

const bersihItem = x => { const o = {id:x.id, nama:x.nama, harga:r2(x.harga), aktif:x.aktif !== false}; if(x.ket) o.ket = x.ket; if(x.minit) o.minit = x.minit; if(x.kategori) o.kategori = x.kategori; if(x.hargaIkut) o.hargaIkut = x.hargaIkut; return o; };
async function simpanSenarai(j, l){
  if(!bolehTetapan(staf)){ toast('⛔ Tiada kuasa Tetapan'); return false; }
  try{ await setDoc(tetapanRef(), {[j]: l.map(bersihItem), dikemaskiniOleh: staf.nama}, {merge:true}); return true; }
  catch(e){ onErr(e); toast('⚠ Gagal simpan: ' + (e.code || e.message)); return false; }
}

function borangMenu(j, id){
  const J = JENIS_ITEM[j], l = senarai(j);
  const x = id ? l.find(v => v.id === id) : {id: j.slice(0,2) + Date.now().toString(36), nama:'', harga:'', aktif:true};
  if(!x) return;
  let gambarBaru;   // undefined = tidak berubah, '' = buang, data URL = baru
  const lihat = () => gambarBaru !== undefined ? gambarBaru : (GAMBAR[x.id] || '');
  openModal(`<div class="between"><h3 style="margin:0">${id?'✏️ Ubah':'➕ Tambah'} ${J.satu}</h3><button class="small" id="mTutup">✕</button></div>
    ${J.gambar ? `<label>Gambar</label><div id="mPrev"></div>
      <div class="row" style="margin-bottom:10px"><label class="btn-dark" style="padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:400;color:#fff">📷 Pilih / ambil gambar<input id="mFail" type="file" accept="image/*" style="display:none"></label><button class="small btn-bad" id="mBuang">Buang gambar</button></div>` : ''}
    <label>Nama</label><input id="mNama" value="${esc(x.nama)}" placeholder="${j==='pakej'?'cth: Premium Wash':j==='addon'?'cth: Tyre Shine':'cth: SUV / MPV'}">
    <div class="two"><div><label>${j==='kenderaan'?'Tambahan harga (RM, boleh negatif)':'Harga (RM)'}</label><input id="mHarga" type="number" inputmode="decimal" step="0.01" value="${x.harga}"></div>
    ${J.minit ? `<div><label>Anggaran masa (minit)</label><input id="mMinit" type="number" inputmode="numeric" value="${x.minit||''}" placeholder="cth: 30"></div>` : ''}</div>
    ${J.ket ? `<label>Keterangan (dipapar di menu)</label><textarea id="mKet" rows="2" placeholder="cth: Snow foam, vakum, tayar berkilat">${esc(x.ket||'')}</textarea>` : ''}
    <label class="row" style="font-weight:400;margin-bottom:12px"><input type="checkbox" id="mAktif" ${x.aktif?'checked':''} style="width:22px;height:22px;margin:0"> Aktif (dipapar di kaunter & menu)</label>
    <button class="btn-gold big" id="mSimpan">SIMPAN</button>
    ${id ? '<button class="btn-bad big" id="mPadam" style="margin-top:8px">Padam</button>' : ''}`);
  const prev = () => { if(!$('#mPrev')) return; const g = lihat(); $('#mPrev').innerHTML = g ? `<img class="prev" src="${g}">` : `<div class="prev" style="height:120px;display:flex;align-items:center;justify-content:center;font-size:40px">${J.ikon}</div>`; };
  prev();
  $('#mTutup').onclick = closeModal;
  if($('#mFail')) $('#mFail').onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ gambarBaru = await kecilkanGambar(f, 640, 0.72); prev(); }catch(_){ toast('Gagal membaca gambar'); } };
  if($('#mBuang')) $('#mBuang').onclick = () => { gambarBaru = ''; prev(); };
  $('#mSimpan').onclick = async () => {
    const nama = val('#mNama'); if(!nama) return toast('Sila isi nama');
    const harga = numVal('#mHarga');
    if(j !== 'kenderaan' && !(harga >= 0)) return toast('Harga tidak sah');
    const baru = {...x, nama, harga, aktif: $('#mAktif').checked};
    if(J.minit){ const m = Math.round(numVal('#mMinit')); if(m > 0) baru.minit = m; else delete baru.minit; }
    if(J.ket){ const k = val('#mKet'); if(k) baru.ket = k; else delete baru.ket; }
    const senaraiBaru = id ? l.map(v => v.id === id ? baru : v) : [...l, baru];
    if(j === 'pakej' && !senaraiBaru.some(v => v.aktif)) return toast('Mesti ada sekurang-kurangnya satu pakej aktif');
    $('#mSimpan').disabled = true;
    try{
      if(gambarBaru) await setDoc(doc(col('gambar'), x.id), {data: gambarBaru, nama, dikemaskini: serverTimestamp()});
      else if(gambarBaru === '') await deleteDoc(doc(col('gambar'), x.id));
    }catch(e){ onErr(e); toast('⚠ Gambar gagal disimpan: ' + (e.code || e.message)); $('#mSimpan').disabled = false; return; }
    if(await simpanSenarai(j, senaraiBaru)){ closeModal(); toast('✅ Disimpan'); } else $('#mSimpan').disabled = false;
  };
  if($('#mPadam')) $('#mPadam').onclick = async () => {
    const tinggal = l.filter(v => v.id !== id);
    if(j === 'pakej' && !tinggal.some(v => v.aktif)) return toast('Mesti ada sekurang-kurangnya satu pakej aktif');
    if(!confirm(`Padam ${x.nama}? (Order lama tidak terjejas)`)) return;
    if(await simpanSenarai(j, tinggal)){ deleteDoc(doc(col('gambar'), id)).catch(() => {}); closeModal(); toast('🗑 Dipadam'); }
  };
}

// =====================================================================
// JAM, RANGKAIAN, PERTUKARAN HARI
// =====================================================================
function tick(){
  $('#jam').textContent = new Date().toLocaleTimeString('en-GB');
  if(staf && today() !== hari){ langganHari(); renderShell(); }
  const d = new Date(); if(staf && d.getSeconds() === 0){ semakMaklumTutup(); kemasBanner(); semakSekatPagi(); }
}
function net(){ const on = navigator.onLine; $('#net').textContent = on ? '● Online' : '● Offline — data disimpan & dihantar bila online'; $('#net').className = 'pill ' + (on ? 'on' : 'off'); }
setInterval(tick, 1000); tick(); net();
addEventListener('online', net); addEventListener('offline', net);
setInterval(() => { if(staf && tab === 'Queue') refreshLive(); }, 60000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Butang 🔄 Sync: hantar data tertunggak, tarik data terkini & pastikan versi apps sama di semua peranti
pasangSync({store, tempat: '.hright', awalan: 'lionsafari-',
  sebelum: () => !$('#modal').classList.contains('hidden') ? 'Ada borang / bayaran sedang dibuka di skrin.' : (tab === 'Order Baru' && $('#oPlat') && val('#oPlat') ? 'Order baru sedang diisi.' : '')});
</script>
