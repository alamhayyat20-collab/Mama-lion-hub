<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">

<title>Lion Safari V2 — Kaunter Mama Lion & Lion King</title>
<style>
:root{--navy:#0f172a;--navy2:#1e293b;--gold:#f59e0b;--gold2:#fef3c7;--ok:#15803d;--bad:#b91c1c;--line:#e5e7eb;--muted:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f1f5f9;color:#0f172a}
header{background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.3px}
header small{display:block;color:var(--gold);font-size:11px;margin-top:1px}
.hright{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--navy2);color:#cbd5e1;white-space:nowrap}
.pill.on{background:#14532d;color:#bbf7d0}.pill.off{background:#7f1d1d;color:#fecaca}
nav{display:flex;gap:6px;overflow-x:auto;background:#fff;padding:8px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px #0002}
nav button{white-space:nowrap;position:relative}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#e2e8f0;color:#0f172a;font-size:14px;font-family:inherit}
button:disabled{opacity:.45}
button.active,.btn-dark{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:#111;font-weight:700}
.btn-ok{background:var(--ok);color:#fff;font-weight:700}
.btn-bad{background:#fee2e2;color:#991b1b}
.small{padding:6px 10px;font-size:12px}
.big{width:100%;padding:15px;font-size:16px;font-weight:700}
.badge{position:absolute;top:-5px;right:-5px;background:#dc2626;color:#fff;font-size:10px;padding:3px 6px;border-radius:999px}
main{max-width:1000px;margin:auto;padding:12px;padding-bottom:40px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000d;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.metric{font-size:22px;font-weight:800;margin-top:3px}
.muted{color:var(--muted);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h3{margin:0 0 10px;font-size:17px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0 10px;font-size:16px;background:#fff;font-family:inherit}
label{font-size:13px;font-weight:650}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.r{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--navy)}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#f1f5f9;font-size:11px;white-space:nowrap}
.tag.gold{background:var(--gold2)}.tag.ok{background:#dcfce7}.tag.bad{background:#fee2e2}
.notice{background:var(--gold2);border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
.notice.bad{background:#fee2e2}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:4px 0 12px}
.choice{background:#f8fafc;border:2px solid #e2e8f0;text-align:left;padding:11px}
.choice.sel{border-color:var(--gold);background:var(--gold2)}
.choice b{display:block;font-size:14px}.choice span{font-size:12px;color:var(--muted)}
.totalbar{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;font-size:15px}
.totalbar b{font-size:22px;color:var(--gold)}
.steps{display:flex;gap:4px;margin:10px 0 8px}
.steps span{flex:1;height:6px;border-radius:4px;background:#e2e8f0}
.steps span.done{background:var(--gold)}
.qcard{border-left:5px solid var(--gold)}
.qcard.siap{border-left-color:var(--ok)}
.plate{font-size:19px;font-weight:800;letter-spacing:1px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0f172acc;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay .box{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.overlay .box{border-radius:18px}}
#lulus{z-index:60}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:10px auto}
.keypad button{padding:16px;font-size:22px;font-weight:700;background:#f1f5f9}
.pindots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);display:block}
.pindots i.f{background:var(--navy)}
.stafgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stafgrid button{padding:16px 10px;background:#fff;box-shadow:0 2px 8px #0001;font-weight:700}
.stafgrid button small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid #cbd5e1}
.bars div{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:1px}
.hlogo{width:40px;height:40px;border-radius:9px;background:#fff;object-fit:contain;flex:none}
.cawgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cawgrid button{background:#fff;border:3px solid #e2e8f0;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 2px 10px #0001}
.cawgrid button img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto 8px}
.cawgrid button b{display:block;font-size:16px}.cawgrid button span{font-size:12px;color:var(--muted)}
.cawgrid button.sel{border-color:var(--gold);background:var(--gold2)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.menu .m{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.menu .m .img,.choice .img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:34px}
.menu .m .isi{padding:9px 10px}
.menu .m b{display:block;font-size:14px}.menu .m .h{color:var(--ok);font-weight:800;font-size:16px;margin-top:2px}
.menu .m small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
.menu.kecil{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.menu.kecil .m .h{font-size:14px}
.choice .img{aspect-ratio:16/10;border-radius:7px;margin-bottom:6px;font-size:24px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item .th{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.item .nm{flex:1;min-width:0}.item .nm b{display:block}.item .nm small{color:var(--muted);font-size:12px}
.item .bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.item.off{opacity:.5}
.prev{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:4px 0 8px;background:#f1f5f9}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90%;text-align:center;display:none}
.thumb{max-width:100%;max-height:180px;border-radius:8px;margin:4px 0 10px}
#resit{display:none}
@media(max-width:600px){.two{grid-template-columns:1fr}.metric{font-size:19px}}
@media print{
  body *{visibility:hidden!important}
  body.cetak-resit #resit,body.cetak-resit #resit *{visibility:visible!important}
  body.cetak-resit #resit{display:block!important;position:absolute;left:0;top:0;width:58mm;font-family:monospace;font-size:11px;color:#000}
  body.cetak-lapor main,body.cetak-lapor main *{visibility:visible!important}
  body.cetak-lapor main{position:absolute;left:0;top:0;width:100%}
  body.cetak-lapor .noprint{display:none!important}
  @page{margin:4mm}
}
#resit .c{text-align:center}#resit hr{border:0;border-top:1px dashed #000;margin:4px 0}
#resit table td{border:0;padding:1px 0;font-size:11px}
</style>
</head>
<body>
<header>
  <div class="row" style="flex-wrap:nowrap;gap:10px"><img id="hLogo" class="hlogo hidden" alt=""><div><b>🦁 Lion Safari V2</b><small id="hCaw">Kaunter carwash</small></div></div>
  <div class="hright"><span id="who"></span><span id="net" class="pill"></span><span id="jam" class="pill"></span></div>
</header>
<nav id="nav"></nav>
<main id="app"><div class="card muted">Memuatkan…</div></main>
<div id="modal" class="overlay hidden"><div class="box" id="modalBox"></div></div>
<div id="lulus" class="overlay hidden"><div class="box" id="lulusBox"></div></div>
<div id="resit"></div>
<div id="toast"></div>

<script type="module">
import { firebaseConfig, BRANCH_ID } from '../firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, query, where, orderBy, limit,
  getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, increment } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

// =====================================================================
// TETAPAN ASAS (Admin sahaja boleh ubah dalam tab Tetapan)
// =====================================================================
const TETAPAN_ASAL = {
  namaKedai: 'Mama Lion Premium Carwash', alamat: '', telefon: '', notaResit: 'Terima kasih! Jumpa lagi 🦁',
  pakej: [{nama:'Basic Wash',harga:15},{nama:'Premium Wash',harga:25},{nama:'Wash & Wax',harga:45},{nama:'Interior Vacuum',harga:20},{nama:'Full Detailing',harga:150}],
  kenderaan: [{nama:'Kereta / Sedan',harga:0},{nama:'SUV / MPV',harga:5},{nama:'4x4 / Van',harga:10},{nama:'Motosikal',harga:-5}],
  addon: [{nama:'Tyre Shine',harga:5},{nama:'Air Freshener',harga:5},{nama:'Engine Wash',harga:20},{nama:'Wax Spray',harga:10}],
  bay: ['Bay 1','Bay 2','Bay 3'],
  floatTunai: 100, hadPetty: 50, hadDiskaun: 0,
  katPetty: ['Makan & Minum Staff','Pengangkutan & Minyak','Alat Tulis','Barang Kecil / Runcit','Penyelenggaraan Kecil','Lain-lain']
};
// Cawangan yang dikongsi satu apps. id = laluan data di Firestore (lionsafari/{id}, akaun/{id}).
const CAWANGAN = [
  {id:'mama-lion', nama:'Mama Lion', kedai:'Mama Lion Premium Carwash', logo:'logo-mamalion.jpg'},
  {id:'lion-king', nama:'Lion King', kedai:'Lion King Premium Carwash', logo:'logo-lionking.jpg'}
];
const STATUS = ['Menunggu','Cuci','Kering','QC','Siap'];
const KAEDAH = ['Tunai','QR / eWallet','Kad','Transfer'];
const KAT_PETTY = ['Makan & Minum Staff','Pengangkutan & Minyak','Alat Tulis','Barang Kecil / Runcit','Penyelenggaraan Kecil','Lain-lain'];
// Peranan & tab yang boleh dibuka. Tetapan = Admin sahaja.
// ID staf, peranan & PIN diberi oleh pemilik dalam apps Akaun (tab Pekerja).
const PERANAN = {
  'Admin':      ['Ringkasan','Order Baru','Queue','Bayaran','Petty Cash','Stok','Laporan','Tetapan'],
  'Manager':    ['Ringkasan','Order Baru','Queue','Bayaran','Petty Cash','Stok','Laporan'],
  'Supervisor': ['Ringkasan','Order Baru','Queue','Bayaran','Petty Cash','Stok','Laporan'],
  'Cashier':    ['Ringkasan','Order Baru','Queue','Bayaran','Petty Cash','Stok'],
  'Pekerja':    ['Queue','Stok']
};
const KETERANGAN_PERANAN = {
  'Admin': 'semua tab termasuk Tetapan (harga, pakej, servis), urus semua staf, kelulusan',
  'Manager': 'semua kecuali Tetapan; urus staf (bukan Admin), urus stok, kelulusan',
  'Supervisor': 'kaunter + laporan; boleh luluskan batal, diskaun & petty cash',
  'Cashier': 'order, queue, bayaran, petty cash, stok (masuk/guna)',
  'Pekerja': 'queue & stok sahaja (staf bay cucian)'
};
const PERANAN_LAMA = {'Pengurus':'Admin', 'Juruwang':'Cashier'};   // data staf versi lama
const PELULUS = ['Admin','Manager','Supervisor'];                    // boleh beri kelulusan PIN
const PENGURUS_STOK = ['Admin','Manager'];                           // tambah/ubah/laras item stok
const tahap = r => ({Admin:4, Manager:3, Supervisor:2, Cashier:1, Pekerja:0})[r] ?? 0;

// =====================================================================
// UTILITI
// =====================================================================
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = n => 'RM ' + (Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const pad = (n,l=2) => String(n).padStart(l,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const sum = (a,f) => a.reduce((t,x) => t + (Number(f ? f(x) : x)||0), 0);
const BLN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const fTarikh = t => t ? `${+t.slice(8,10)} ${BLN[+t.slice(5,7)-1]} ${t.slice(0,4)}` : '';
const fBulan = b => `${BLN[+b.slice(5,7)-1]} ${b.slice(0,4)}`;
const fMasa = ms => ms ? new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
const minit = ms => ms ? Math.max(0, Math.round((Date.now()-ms)/60000)) : 0;
const numVal = id => { const v = parseFloat(String($(id)?.value||'').replace(',','.')); return isNaN(v) ? 0 : r2(v); };
const val = id => String($(id)?.value || '').trim();
const groupSum = (list, kf, vf) => list.reduce((m,x) => { const k = kf(x) || 'Lain-lain'; m[k] = m[k] || {n:0, rm:0}; m[k].n++; m[k].rm += Number(vf(x))||0; return m; }, {});
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2800); }
async function hashPin(id, pin){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`lionsafari:${id}:${pin}`));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
const senaraiKeTeks = l => l.map(x => typeof x === 'string' ? x : `${x.nama} | ${x.harga}`).join('\n');
const teksKeSenarai = t => t.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const [n,h] = s.split('|'); return {nama:n.trim(), harga:r2(parseFloat(h)||0)}; }).filter(x => x.nama);

// =====================================================================
// FIREBASE
// =====================================================================
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const store = initializeFirestore(fbApp, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
// Cawangan peranti ini (dipilih sekali pada setiap telefon/tablet kaunter)
let cawangan = (() => { try{ const c = localStorage.getItem('ls_cawangan'); return CAWANGAN.some(x => x.id === c) ? c : null; }catch(_){ return null; } })();
const infoCaw = () => CAWANGAN.find(x => x.id === cawangan) || {id:cawangan, nama:cawangan, kedai:'Premium Carwash', logo:''};
const col = n => collection(store, 'lionsafari', cawangan, n);
const akaunCol = () => collection(store, 'akaun', cawangan, 'entri');
const tetapanRef = () => doc(store, 'lionsafari', cawangan, 'tetapan', 'umum');
const asalCaw = () => ({...TETAPAN_ASAL, namaKedai: infoCaw().kedai});

// =====================================================================
// KEADAAN
// =====================================================================
let dev = null, staf = null, stafList = [], stafLoaded = false, T = {...TETAPAN_ASAL};
let tab = 'Ringkasan', hari = today();
let aktif = [], dibuatHari = [], bayarHari = [], stok = [], petty = [];
let unsubAsas = [], unsubHari = [], dataError = '';
let pasangPrompt = null;
let GAMBAR = {};   // id item -> gambar (data URL), dari koleksi lionsafari/{cawangan}/gambar
// Senarai pakej / kenderaan / add-on dengan id tetap (untuk gambar & susunan)
const JENIS_ITEM = {
  pakej: {label:'Pakej Cucian', satu:'pakej', ikon:'🚿', gambar:true, ket:true, minit:true},
  addon: {label:'Servis Tambahan (Add-on)', satu:'servis tambahan', ikon:'✨', gambar:true, ket:true, minit:false},
  kenderaan: {label:'Jenis Kenderaan', satu:'jenis kenderaan', ikon:'🚗', gambar:false, ket:false, minit:false}
};
const senarai = j => (T[j] || []).map((x,i) => ({...x, id: x.id || `${j}-${i}`, aktif: x.aktif !== false, harga: Number(x.harga)||0}));
const aktifSahaja = j => senarai(j).filter(x => x.aktif);
const imgItem = (x, kelas='img', ikon='🚗') => GAMBAR[x.id] ? `<img class="${kelas}" src="${GAMBAR[x.id]}" alt="">` : `<div class="${kelas}">${ikon}</div>`;
let pilihPakejAwal = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pasangPrompt = e; });

function onErr(e){
  console.error(e);
  dataError = e.code === 'permission-denied'
    ? 'Firebase menolak akses (permission-denied). Firestore Rules untuk "lionsafari" belum ditambah — lihat README.'
    : 'Ralat sambungan data: ' + (e.message || e);
  if(staf) refreshLive(); else renderPinScreen();
}
const stopAll = l => { l.forEach(f => f && f()); l.length = 0; };

// =====================================================================
// LOG MASUK PERANTI (sekali sahaja setiap telefon)
// =====================================================================
onAuthStateChanged(auth, u => {
  dev = u;
  if(!u){ stopAll(unsubAsas); stopAll(unsubHari); staf = null; stafLoaded = false; dataError = ''; setHeader(); return renderDeviceLogin(); }
  if(!cawangan) return renderPilihCawangan();
  mulaCawangan();
});

// Mula / tukar cawangan: langgan senarai staf & tetapan cawangan ini sahaja
function mulaCawangan(){
  stopAll(unsubAsas); stopAll(unsubHari);
  staf = null; stafLoaded = false; stafList = []; dataError = '';
  aktif = []; dibuatHari = []; bayarHari = []; stok = []; petty = [];
  T = asalCaw(); tab = 'Ringkasan'; GAMBAR = {};
  setHeader();
  unsubAsas.push(onSnapshot(col('staf'), s => {
    stafList = s.docs.map(d => { const x = {id:d.id, ...d.data()}; x.peranan = PERANAN_LAMA[x.peranan] || x.peranan; if(!PERANAN[x.peranan]) x.peranan = 'Pekerja'; return x; }).sort((a,b) => tahap(b.peranan) - tahap(a.peranan) || a.nama.localeCompare(b.nama));
    stafLoaded = true;
    if(!staf){
      let simpan = null; try{ simpan = JSON.parse(localStorage.getItem('ls_staf') || 'null'); }catch(_){}
      const st = simpan && simpan.c === cawangan && Date.now() - simpan.t < 12*3600e3 && stafList.find(x => x.id === simpan.id && x.aktif !== false);
      if(st) masukStaf(st); else renderPinScreen();
    } else {
      const baru = stafList.find(x => x.id === staf.id);
      if(!baru || baru.aktif === false){ kunci(); return; }
      staf = baru; refreshLive();
    }
  }, onErr));
  unsubAsas.push(onSnapshot(col('gambar'), s => { GAMBAR = Object.fromEntries(s.docs.map(d => [d.id, d.data().data])); if(staf) refreshLive(); }, onErr));
  unsubAsas.push(onSnapshot(tetapanRef(), s => { T = {...asalCaw(), ...(s.exists() ? s.data() : {})}; if(staf) refreshLive(); }, onErr));
  renderPinScreen();
}

function setHeader(){
  const c = cawangan && infoCaw();
  $('#hCaw').textContent = c ? `${c.nama} Premium Carwash` : 'Kaunter carwash';
  if(c && c.logo){ $('#hLogo').src = c.logo; $('#hLogo').classList.remove('hidden'); } else $('#hLogo').classList.add('hidden');
}

function renderPilihCawangan(bolehBatal=false){
  stopAll(unsubAsas); stopAll(unsubHari); staf = null;
  $('#nav').innerHTML = ''; $('#who').innerHTML = `<button class="small" id="btnDevOut">Log keluar peranti</button>`;
  $('#btnDevOut').onclick = () => { if(confirm('Log keluar peranti ini? Akaun Firebase perlu dimasukkan semula.')) signOut(auth); };
  setHeader();

function keypad(boxSel, onDone, label=''){
  let pin = '';
  const box = $(boxSel);
  const draw = (msg='') => {
    box.innerHTML = `${label}<div class="pindots">${[0,1,2,3,4,5].map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
      <div class="neg" style="text-align:center;font-size:13px;min-height:18px">${esc(msg)}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="btn-gold">OK</button></div>`;
    box.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      const k = b.dataset.k;
      if(k === 'del') pin = pin.slice(0,-1);
      else if(k === 'ok'){ if(pin.length < 4) return draw('PIN 4–6 digit'); const p = pin; pin = ''; const m = await onDone(p); if(m) return draw(m); return; }
      else if(pin.length < 6) pin += k;
      draw();
    });
  };
  draw();
}

function masukStaf(s){
  staf = s;
  try{ localStorage.setItem('ls_staf', JSON.stringify({id:s.id, c:cawangan, t:Date.now()})); }catch(_){}
  if(!PERANAN[s.peranan]?.includes(tab)) tab = PERANAN[s.peranan]?.[0] || 'Queue';
  langganHari();
  renderShell();
}
function kunci(){ staf = null; try{ localStorage.removeItem('ls_staf'); }catch(_){} stopAll(unsubHari); closeModal(); renderPinScreen(); }

function langganHari(){
  stopAll(unsubHari);
  hari = today();
  unsubHari.push(onSnapshot(query(col('order'), where('aktif','==',true)), s => { aktif = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.masaDibuat||0)-(b.masaDibuat||0)); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(query(col('order'), where('tarikh','==',hari)), s => { dibuatHari = s.docs.map(d => ({id:d.id, ...d.data()})); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(query(col('order'), where('tarikhBayar','==',hari)), s => { bayarHari = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.masaBayar||0)-(a.masaBayar||0)); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(col('stok'), s => { stok = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => a.nama.localeCompare(b.nama)); refreshLive(); }, onErr));
  unsubHari.push(onSnapshot(col('petty'), s => { petty = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.masa||0)-(a.masa||0)); refreshLive(); }, onErr));
}

function mintaLulus(sebab){
  return new Promise(resolve => {
    const ov = $('#lulus');
    ov.classList.remove('hidden');
    $('#lulusBox').innerHTML = `<div style="text-align:center"><h3>🔐 KELULUSAN DIPERLUKAN</h3><div class="notice">${esc(sebab)}</div>
      <div class="muted">PIN Supervisor / Manager / Admin</div><div id="kpL"></div><button class="small" id="btnTolak">Batal</button></div>`;
    const tutup = v => { ov.classList.add('hidden'); resolve(v); };
    $('#btnTolak').onclick = () => tutup(null);
    keypad('#kpL', async pin => {
      for(const s of stafList.filter(x => PELULUS.includes(x.peranan) && x.aktif !== false))
        if(await hashPin(s.id, pin) === s.pinHash){ tutup(s.nama); return; }
      return 'PIN tidak sah / tiada kuasa kelulusan';
    });
  });
}

function badge(t){

  if(t === 'Bayaran'){ const n = aktif.filter(o => o.status === 'Siap').length; if(n) return n; }
  if(t === 'Stok'){ const n = stok.filter(s => (s.baki||0) <= (s.min||0)).length; if(n) return n; }

}

async function kemaskiniAkaunHari(tarikh){
  try{
    const s = await getDocs(query(col('order'), where('tarikhBayar','==',tarikh)));
    const paid = s.docs.map(d => d.data()).filter(o => o.status !== 'Batal' && o.bayar);
    const ref = doc(akaunCol(), 'ls-' + tarikh);
    if(!paid.length){ await deleteDoc(ref).catch(() => {}); return; }
    const by = k => r2(sum(paid.filter(o => o.bayar.kaedah === k), o => o.jumlah));
    const tunai = by('Tunai'), qr = by('QR / eWallet'), kad = by('Kad'), lain = by('Transfer');
    await setDoc(ref, {jenis:'jualan', tarikh, bulan:tarikh.slice(0,7), cawangan, tunai, qr, kad, ewallet:0, lain,
      kereta: paid.length, amaun: r2(tunai+qr+kad+lain), catatan:`Auto dari Lion Safari V2 (${paid.length} order${lain?`, Transfer ${RM(lain)}`:''})`,
      sumber:'lionsafari', auto:true, guna_petty:false, hutang:false, oleh:'Lion Safari V2', dikemaskini: serverTimestamp()});
  }catch(e){ console.error(e); toast('⚠ Jualan disimpan, tetapi gagal dihantar ke Akaun: ' + (e.code || e.message)); }
}
async function cerminPetty(id, p){
  const ref = doc(akaunCol(), 'lsp-' + id);
  try{
    if(!p) return await deleteDoc(ref);
    const masuk = p.jenis === 'Top-up';
    await setDoc(ref, {jenis:'petty', tarikh:p.tarikh, bulan:p.tarikh.slice(0,7), cawangan, petty_arah: masuk ? 'masuk' : 'keluar',
      kategori: masuk ? 'Top-up' : p.kategori, perkara: p.perkara, amaun: p.amaun, bayar:'Petty Cash', guna_petty:true, hutang:false,
      sumber:'lionsafari', auto:true, oleh: p.oleh, dikemaskini: serverTimestamp()});
  }catch(e){ console.error(e); toast('⚠ Petty cash disimpan, tetapi gagal dihantar ke Akaun: ' + (e.code || e.message)); }
}

async function kecilkanGambar(fail, maks=900, kualiti=0.6){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(fail); });
  const s = Math.min(1, maks / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', kualiti);
}

function bukaBayar(o){
  if(!o) return;
  let kaedah = 'Tunai', bukti = '';
  openModal(`<div class="between"><h3 style="margin:0">💳 Bayaran — ${esc(o.plat)}</h3><button class="small" id="mTutup">✕</button></div>
    <div class="muted">${esc(o.no)} · ${esc(o.kenderaan)}</div>
    <table style="margin:8px 0">${barisItem(o).map(([n,h]) => `<tr><td>${esc(n)}</td><td class="r">${RM(h)}</td></tr>`).join('')}</table>
    <label>Diskaun (RM)</label><input id="pDis" type="number" inputmode="decimal" step="0.01" value="" placeholder="0.00">
    <div class="totalbar"><span>Perlu dibayar</span><b id="pJum">${RM(o.jumlahKasar)}</b></div>
    <label>Cara bayar</label><div class="choices" id="pKaedah">${KAEDAH.map(k => `<button class="choice ${k==='Tunai'?'sel':''}" data-k="${k}"><b>${k}</b></button>`).join('')}</div>
    <div id="pTunai"><label>Wang diterima (RM)</label><input id="pTerima" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
      <div class="row" id="pCepat"></div><div class="totalbar" style="background:#14532d"><span>Baki dipulangkan</span><b id="pBaki" style="color:#bbf7d0">RM 0.00</b></div></div>
    <div id="pBukan" class="hidden"><label>No. rujukan transaksi</label><input id="pRuj" placeholder="cth: 4 digit terakhir / ID transaksi">
      <label>Bukti bayaran (gambar, pilihan)</label><input id="pBukti" type="file" accept="image/*" capture="environment"><img id="pThumb" class="thumb hidden"></div>
    <div class="row" style="margin-top:6px"><button class="btn-ok big" style="flex:1" id="pSimpan">SIMPAN BAYARAN</button><button class="btn-gold big" style="flex:1" id="pCetak">SIMPAN & PRINT RESIT</button></div>`);
  const jum = () => Math.max(0, r2(o.jumlahKasar - numVal('#pDis')));
  const kira = () => {
    $('#pJum').textContent = RM(jum());
    const t = numVal('#pTerima'); $('#pBaki').textContent = RM(Math.max(0, t - jum()));
    const j = jum(); const cadang = [...new Set([j, Math.ceil(j/10)*10, Math.ceil(j/50)*50, 100])].filter(x => x >= j).slice(0,4);
    $('#pCepat').innerHTML = cadang.map(x => `<button class="small" data-c="${x}">${RM(x)}</button>`).join('');
    $$('#pCepat [data-c]').forEach(b => b.onclick = () => { $('#pTerima').value = b.dataset.c; kira(); });
  };
  kira();
  $('#mTutup').onclick = closeModal;
  $('#pDis').oninput = kira; $('#pTerima').oninput = kira;
  $$('#pKaedah .choice').forEach(b => b.onclick = () => {
    kaedah = b.dataset.k; $$('#pKaedah .choice').forEach(x => x.classList.toggle('sel', x === b));
    $('#pTunai').classList.toggle('hidden', kaedah !== 'Tunai'); $('#pBukan').classList.toggle('hidden', kaedah === 'Tunai');
  });
  $('#pBukti').onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ bukti = await kecilkanGambar(f); $('#pThumb').src = bukti; $('#pThumb').classList.remove('hidden'); }catch(_){ toast('Gagal membaca gambar'); } };
  const simpan = async cetak => {
    const dis = numVal('#pDis');
    if(dis < 0 || dis > o.jumlahKasar) return toast('Diskaun tidak sah');
    const j = jum();
    let diterima = 0, baki = 0;
    if(kaedah === 'Tunai'){
      diterima = numVal('#pTerima') || j;
      if(diterima < j) return toast('Wang diterima kurang daripada jumlah');
      baki = r2(diterima - j);
    }
    let diskaunLulus = '';
    if(dis > (Number(T.hadDiskaun)||0)){
      diskaunLulus = await perluLulus(`Diskaun ${RM(dis)} untuk ${o.plat}`);
      if(!diskaunLulus) return;
    }
    $('#pSimpan').disabled = $('#pCetak').disabled = true;
    const t = today();
    const data = {bayar:{kaedah, rujukan: kaedah==='Tunai' ? '' : val('#pRuj'), bukti: kaedah==='Tunai' ? '' : bukti, diterima, baki},
      diskaun: dis, diskaunLulus, jumlah: j, status:'Selesai', aktif:false, tarikhBayar:t, bulanBayar:t.slice(0,7), dibayarOleh: staf.nama, masaBayar: Date.now()};
    try{
      await updateDoc(doc(col('order'), o.id), data);
      closeModal();
      toast(`✅ ${o.plat} dibayar ${RM(j)}${baki ? ' — baki ' + RM(baki) : ''}`);
      if(cetak) cetakResit({...o, ...data});
      kemaskiniAkaunHari(t);
    }catch(e){ onErr(e); $('#pSimpan').disabled = $('#pCetak').disabled = false; }
  };
  $('#pSimpan').onclick = () => simpan(false);
  $('#pCetak').onclick = () => simpan(true);
}

function gerakStok(s, jenis){
  const tajuk = {Masuk:'➕ Terima stok', Guna:'➖ Guna / keluarkan stok', Laras:'⚖ Laras kiraan stok'}[jenis];
  openModal(`<div class="between"><h3 style="margin:0">${tajuk}</h3><button class="small" id="mTutup">✕</button></div>
    <p><b>${esc(s.nama)}</b> — baki sekarang <b>${s.baki} ${esc(s.unit)}</b></p>
    <label>${jenis==='Laras'?'Kiraan sebenar ('+esc(s.unit)+')':'Kuantiti ('+esc(s.unit)+')'}</label><input id="gQty" type="number" inputmode="decimal" step="0.1">
    <label>Catatan</label><input id="gCat" placeholder="${jenis==='Masuk'?'cth: dari Kedai ABC':'cth: Bay 2'}">
    <button class="btn-gold big" id="gSimpan">SIMPAN</button>`);
  $('#mTutup').onclick = closeModal;
  $('#gSimpan').onclick = async () => {
    const q = numVal('#gQty');
    if(jenis !== 'Laras' && !(q > 0)) return toast('Sila isi kuantiti');
    if(jenis === 'Laras' && q < 0) return toast('Kiraan tidak sah');
    let delta = jenis === 'Masuk' ? q : jenis === 'Guna' ? -q : r2(q - (s.baki||0));
    let lulus = '';
    if(jenis === 'Laras'){ lulus = await perluLulus(`Laras stok ${s.nama}: ${s.baki} → ${q}`); if(!lulus) return; }
    if(jenis === 'Guna' && q > (s.baki||0) && !confirm('Kuantiti melebihi baki. Teruskan?')) return;
    const t = today();
    try{
      await updateDoc(doc(col('stok'), s.id), {baki: increment(delta)});
      await addDoc(col('stok_log'), {item:s.id, nama:s.nama, jenis, kuantiti:delta, catatan: val('#gCat'), oleh: staf.nama, lulus, tarikh:t, masa:Date.now()});
      closeModal(); toast('✅ Stok dikemas kini');
    }catch(e){ onErr(e); }
  };
}

}
function lapHarian(){

    <div><div class="muted">Purata</div><div class="metric">${RM(sah.length?jum/sah.length:0)}</div></div><div><div class="muted">Diskaun</div><div class="metric">${RM(sum(sah,o=>o.diskaun))}</div></div></div></div>

    ${belum.length && lTarikh !== today() ? `<div class="notice">⚠ ${belum.length} order dibuat pada tarikh ini masih belum dibayar.</div>` : ''}`;
}
function lapBulanan(){
  const sah = lData.bayar.filter(o => o.status !== 'Batal');
  const jum = sum(sah, o => o.jumlah);
  const hariN = new Date(+lBulan.slice(0,4), +lBulan.slice(5,7), 0).getDate();
  const perHari = Array.from({length:hariN}, (_,i) => { const t = `${lBulan}-${pad(i+1)}`; const l = sah.filter(o => o.tarikhBayar === t); return {t, n:l.length, rm:sum(l,o=>o.jumlah), k:Object.fromEntries(KAEDAH.map(k => [k, sum(l.filter(o=>o.bayar?.kaedah===k),o=>o.jumlah)]))}; });
  const max = Math.max(1, ...perHari.map(h => h.rm)), aktifH = perHari.filter(h => h.n);
  const terbaik = [...aktifH].sort((a,b) => b.rm - a.rm)[0];
  return `<div class="row noprint" style="margin-bottom:10px"><button class="btn-dark" id="lCetak">🖨 Cetak / PDF</button><button id="lCsv">⬇ CSV (Excel)</button></div>

    <div class="grid"><div><div class="muted">Jumlah jualan</div><div class="metric pos">${RM(jum)}</div></div><div><div class="muted">Kenderaan</div><div class="metric">${sah.length}</div></div>
    <div><div class="muted">Purata sehari</div><div class="metric">${RM(aktifH.length?jum/aktifH.length:0)}</div></div><div><div class="muted">Hari terbaik</div><div class="metric">${terbaik?fTarikh(terbaik.t).slice(0,-5):'-'}</div><div class="muted">${terbaik?RM(terbaik.rm):''}</div></div></div>
    <div class="bars" style="margin-top:12px">${perHari.map(h => `<div style="height:${h.rm?Math.max(3,h.rm/max*100):1}%;${h.rm?'':'background:#e2e8f0'}"></div>`).join('')}</div></div>
    <div class="card"><h3>Ikut cara bayar</h3>${jadual(groupSum(sah, o => o.bayar?.kaedah, o => o.jumlah))}</div>
    <div class="card"><h3>Ikut pakej</h3>${jadual(groupSum(sah, o => o.pakej, o => o.hargaPakej))}</div>
    <div class="card"><h3>Ikut hari</h3><div style="overflow-x:auto"><table><tr><th>Tarikh</th><th class="r">Kend.</th><th class="r">Tunai</th><th class="r">QR</th><th class="r">Kad</th><th class="r">Transfer</th><th class="r">Jumlah</th></tr>
      ${aktifH.map(h => `<tr><td>${fTarikh(h.t).slice(0,-5)}</td><td class="r">${h.n}</td>${KAEDAH.map(k => `<td class="r">${h.k[k]?h.k[k].toFixed(2):'-'}</td>`).join('')}<td class="r"><b>${RM(h.rm)}</b></td></tr>`).join('')}
      <tr class="tot"><td>Jumlah</td><td class="r">${sah.length}</td>${KAEDAH.map(k => `<td class="r">${sum(aktifH,h=>h.k[k]).toFixed(2)}</td>`).join('')}<td class="r">${RM(jum)}</td></tr></table></div></div>`;
}
function csvBulanan(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const kol = ['tarikhBayar','no','plat','kenderaan','pakej','addon','jumlahKasar','diskaun','jumlah','kaedah','rujukan','status','dibuatOleh','dibayarOleh'];
  const rows = [...lData.bayar].sort((a,b) => (a.masaBayar||0)-(b.masaBayar||0)).map(o => ({...o, addon:(o.addon||[]).map(a=>a.nama).join(' + '), kaedah:o.bayar?.kaedah, rujukan:o.bayar?.rujukan}));
  const csv = '﻿' + kol.join(',') + '\n' + rows.map(r => kol.map(k => q(r[k])).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = `lion-safari-jualan-${lBulan}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

VIEWS['Tetapan'] = {
  statik: () => staf.peranan !== 'Admin' ? '<div class="notice bad">⛔ Tetapan hanya untuk Admin.</div>' : `<div class="card"><h3>⚙️ Tetapan — ${esc(infoCaw().nama)}</h3>
      <div class="muted">Perubahan pakej, servis & harga di bawah disimpan <b>serta-merta</b> dan terus dipakai di semua peranti kaunter cawangan ini. Harga order yang sudah dibuat tidak berubah.</div></div>
    <div id="live"></div>
    <div class="card"><h3>🏪 Maklumat kedai (untuk resit)</h3>
      <label>Nama kedai</label><input id="tNama" value="${esc(T.namaKedai)}">
      <label>Alamat</label><input id="tAlamat" value="${esc(T.alamat)}">
      <label>Telefon</label><input id="tTel" value="${esc(T.telefon)}">
      <label>Nota bawah resit</label><input id="tNota" value="${esc(T.notaResit)}"></div>
    <div class="card"><h3>🅿️ Bay & kategori</h3>
      <label>Bay cucian (satu setiap baris)</label><textarea id="tBay" rows="3">${esc(T.bay.join('\n'))}</textarea>
      <label>Kategori petty cash (satu setiap baris)</label><textarea id="tKatPetty" rows="5">${esc((T.katPetty?.length ? T.katPetty : KAT_PETTY).join('\n'))}</textarea></div>
    <div class="card"><h3>🔐 Kawalan & kelulusan</h3><div class="two">
      <div><label>Float tunai laci (RM)</label><input id="tFloat" type="number" inputmode="decimal" value="${T.floatTunai}"></div>
      <div><label>Had belanja petty cash tanpa kelulusan (RM)</label><input id="tPetty" type="number" inputmode="decimal" value="${T.hadPetty}"></div>
      <div><label>Had diskaun tanpa kelulusan (RM)</label><input id="tDis" type="number" inputmode="decimal" value="${T.hadDiskaun}"></div></div>
      <div class="muted">0 = setiap diskaun perlu PIN Supervisor / Manager / Admin.</div></div>
    <button class="btn-gold big" id="tSimpan">SIMPAN MAKLUMAT KEDAI, BAY & KAWALAN</button>
    <div class="card" style="margin-top:12px"><h3>📱 Peranti ini</h3><div class="muted">Log masuk sebagai ${esc(dev?.email||'')} · Cawangan: <b>${esc(infoCaw().nama)}</b></div>
      <div class="row" style="margin-top:8px"><button id="tTukarCaw">🏪 Tukar cawangan peranti</button><button class="btn-bad" id="tDevOut">Log keluar peranti</button></div></div>`,
  pasang(){
    if(staf.peranan !== 'Admin') return;
    $('#tSimpan').onclick = async () => {
      const d = {namaKedai: val('#tNama') || infoCaw().kedai, alamat: val('#tAlamat'), telefon: val('#tTel'), notaResit: val('#tNota'),
        bay: $('#tBay').value.split('\n').map(s => s.trim()).filter(Boolean),
        katPetty: $('#tKatPetty').value.split('\n').map(s => s.trim()).filter(Boolean),
        floatTunai: numVal('#tFloat'), hadPetty: numVal('#tPetty'), hadDiskaun: numVal('#tDis'), dikemaskiniOleh: staf.nama};
      if(!d.bay.length) d.bay = ['Bay 1'];
      if(!d.katPetty.length) d.katPetty = [...KAT_PETTY];
      try{ await setDoc(tetapanRef(), d, {merge:true}); toast('✅ Tetapan disimpan'); }catch(e){ onErr(e); }
    };
    $('#tTukarCaw').onclick = () => { closeModal(); kunci(); renderPilihCawangan(true); };
    $('#tDevOut').onclick = () => { if(confirm('Log keluar peranti ini?')) { try{ localStorage.removeItem('ls_staf'); }catch(_){} signOut(auth); } };
  },
  // Senarai pakej / servis / kenderaan dikemas kini secara langsung
  live: () => staf.peranan !== 'Admin' ? '' : Object.entries(JENIS_ITEM).map(([j, J]) => {
    const l = senarai(j);
    return `<div class="card"><div class="between"><h3 style="margin:0">${J.ikon} ${J.label}</h3><button class="btn-dark small" data-tambah="${j}">+ Tambah</button></div>
      ${j==='kenderaan' ? '<div class="muted" style="margin-top:4px">Harga di sini ialah <b>tambahan</b> kepada harga pakej (boleh negatif, cth motosikal −5).</div>' : ''}
      <div style="margin-top:6px">${l.map((x,i) => `<div class="item ${x.aktif?'':'off'}">
        ${J.gambar ? imgItem(x,'th',J.ikon) : ''}
        <div class="nm"><b>${esc(x.nama)}</b><small>${j==='kenderaan' ? (x.harga ? (x.harga>0?'+':'')+RM(x.harga) : 'harga asas') : (j==='addon'?'+':'')+RM(x.harga)}${x.minit?` · ~${x.minit} min`:''}${x.aktif?'':' · <b>tidak aktif</b>'}</small>${x.ket?`<small style="display:block">${esc(x.ket)}</small>`:''}</div>
        <div class="bt"><button class="small" data-gerak="${j}|${i}|-1" ${i===0?'disabled':''}>▲</button><button class="small" data-gerak="${j}|${i}|1" ${i===l.length-1?'disabled':''}>▼</button><button class="small" data-ubah="${j}|${x.id}">✏️ Ubah</button></div>
      </div>`).join('') || '<p class="muted">Tiada lagi.</p>'}</div></div>`;
  }).join(''),
  pasangLive(){
    if(staf.peranan !== 'Admin') return;
    $$('[data-tambah]').forEach(b => b.onclick = () => borangMenu(b.dataset.tambah, null));
    $$('[data-ubah]').forEach(b => b.onclick = () => { const [j, id] = b.dataset.ubah.split('|'); borangMenu(j, id); });
    $$('[data-gerak]').forEach(b => b.onclick = async () => {
      const [j, i, d] = b.dataset.gerak.split('|'); const l = senarai(j), a = +i, c = a + +d;
      if(c < 0 || c >= l.length) return;
      [l[a], l[c]] = [l[c], l[a]];
      await simpanSenarai(j, l);
    });
  }
};

const bersihItem = x => { const o = {id:x.id, nama:x.nama, harga:r2(x.harga), aktif:x.aktif !== false}; if(x.ket) o.ket = x.ket; if(x.minit) o.minit = x.minit; return o; };
async function simpanSenarai(j, l){
  if(staf.peranan !== 'Admin'){ toast('⛔ Hanya Admin'); return false; }
  try{ await setDoc(tetapanRef(), {[j]: l.map(bersihItem), dikemaskiniOleh: staf.nama}, {merge:true}); return true; }
  catch(e){ onErr(e); toast('⚠ Gagal simpan: ' + (e.code || e.message)); return false; }
}

function borangMenu(j, id){
  const J = JENIS_ITEM[j], l = senarai(j);
  const x = id ? l.find(v => v.id === id) : {id: j.slice(0,2) + Date.now().toString(36), nama:'', harga:'', aktif:true};
  if(!x) return;
  let gambarBaru;   // undefined = tidak berubah, '' = buang, data URL = baru
  const lihat = () => gambarBaru !== undefined ? gambarBaru : (GAMBAR[x.id] || '');
  openModal(`<div class="between"><h3 style="margin:0">${id?'✏️ Ubah':'➕ Tambah'} ${J.satu}</h3><button class="small" id="mTutup">✕</button></div>
    ${J.gambar ? `<label>Gambar</label><div id="mPrev"></div>
      <div class="row" style="margin-bottom:10px"><label class="btn-dark" style="padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:400;color:#fff">📷 Pilih / ambil gambar<input id="mFail" type="file" accept="image/*" style="display:none"></label><button class="small btn-bad" id="mBuang">Buang gambar</button></div>` : ''}
    <label>Nama</label><input id="mNama" value="${esc(x.nama)}" placeholder="${j==='pakej'?'cth: Premium Wash':j==='addon'?'cth: Tyre Shine':'cth: SUV / MPV'}">
    <div class="two"><div><label>${j==='kenderaan'?'Tambahan harga (RM, boleh negatif)':'Harga (RM)'}</label><input id="mHarga" type="number" inputmode="decimal" step="0.01" value="${x.harga}"></div>
    ${J.minit ? `<div><label>Anggaran masa (minit)</label><input id="mMinit" type="number" inputmode="numeric" value="${x.minit||''}" placeholder="cth: 30"></div>` : ''}</div>
    ${J.ket ? `<label>Keterangan (dipapar di menu)</label><textarea id="mKet" rows="2" placeholder="cth: Snow foam, vakum, tayar berkilat">${esc(x.ket||'')}</textarea>` : ''}
    <label class="row" style="font-weight:400;margin-bottom:12px"><input type="checkbox" id="mAktif" ${x.aktif?'checked':''} style="width:22px;height:22px;margin:0"> Aktif (dipapar di kaunter & menu)</label>
    <button class="btn-gold big" id="mSimpan">SIMPAN</button>
    ${id ? '<button class="btn-bad big" id="mPadam" style="margin-top:8px">Padam</button>' : ''}`);
  const prev = () => { if(!$('#mPrev')) return; const g = lihat(); $('#mPrev').innerHTML = g ? `<img class="prev" src="${g}">` : `<div class="prev" style="height:120px;display:flex;align-items:center;justify-content:center;font-size:40px">${J.ikon}</div>`; };
  prev();
  $('#mTutup').onclick = closeModal;
  if($('#mFail')) $('#mFail').onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ gambarBaru = await kecilkanGambar(f, 640, 0.72); prev(); }catch(_){ toast('Gagal membaca gambar'); } };
  if($('#mBuang')) $('#mBuang').onclick = () => { gambarBaru = ''; prev(); };
  $('#mSimpan').onclick = async () => {
    const nama = val('#mNama'); if(!nama) return toast('Sila isi nama');
    const harga = numVal('#mHarga');
    if(j !== 'kenderaan' && !(harga >= 0)) return toast('Harga tidak sah');
    const baru = {...x, nama, harga, aktif: $('#mAktif').checked};
    if(J.minit){ const m = Math.round(numVal('#mMinit')); if(m > 0) baru.minit = m; else delete baru.minit; }
    if(J.ket){ const k = val('#mKet'); if(k) baru.ket = k; else delete baru.ket; }
    const senaraiBaru = id ? l.map(v => v.id === id ? baru : v) : [...l, baru];
    if(j === 'pakej' && !senaraiBaru.some(v => v.aktif)) return toast('Mesti ada sekurang-kurangnya satu pakej aktif');
    $('#mSimpan').disabled = true;
    try{
      if(gambarBaru) await setDoc(doc(col('gambar'), x.id), {data: gambarBaru, nama, dikemaskini: serverTimestamp()});
      else if(gambarBaru === '') await deleteDoc(doc(col('gambar'), x.id));
    }catch(e){ onErr(e); toast('⚠ Gambar gagal disimpan: ' + (e.code || e.message)); $('#mSimpan').disabled = false; return; }
    if(await simpanSenarai(j, senaraiBaru)){ closeModal(); toast('✅ Disimpan'); } else $('#mSimpan').disabled = false;
  };
  if($('#mPadam')) $('#mPadam').onclick = async () => {
    const tinggal = l.filter(v => v.id !== id);
    if(j === 'pakej' && !tinggal.some(v => v.aktif)) return toast('Mesti ada sekurang-kurangnya satu pakej aktif');
    if(!confirm(`Padam ${x.nama}? (Order lama tidak terjejas)`)) return;
    if(await simpanSenarai(j, tinggal)){ deleteDoc(doc(col('gambar'), id)).catch(() => {}); closeModal(); toast('🗑 Dipadam'); }
  };
}

// =====================================================================
// JAM, RANGKAIAN, PERTUKARAN HARI
// =====================================================================
function tick(){
  $('#jam').textContent = new Date().toLocaleTimeString('en-GB');
  if(staf && today() !== hari){ langganHari(); renderShell(); }
}
function net(){ const on = navigator.onLine; $('#net').textContent = on ? '● Online' : '● Offline — data disimpan & dihantar bila online'; $('#net').className = 'pill ' + (on ? 'on' : 'off'); }
setInterval(tick, 1000); tick(); net();
addEventListener('online', net); addEventListener('offline', net);
setInterval(() => { if(staf && tab === 'Queue') refreshLive(); }, 60000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
